<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 갤러리</title>
<style>
  @font-face { font-family:'Pretendard'; src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2'); font-weight:400; }
  @font-face { font-family:'Pretendard'; src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2'); font-weight:700; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Pretendard','Malgun Gothic',sans-serif; background:linear-gradient(to bottom,#086266,#9adcda); min-height:100vh; padding:40px 24px 60px; color:#1a3a3c; }
  header { max-width:1200px; margin:0 auto 28px; color:#fff; text-align:center; }
  header h1 { font-size:28px; font-weight:700; letter-spacing:-0.5px; text-shadow:0 2px 8px rgba(0,0,0,0.15); }
  header p { margin-top:8px; font-size:14px; opacity:0.92; }
  .header-top { display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; flex-wrap:wrap; }
  .header-title { display:flex; align-items:center; gap:10px; }
  .header-logo { height:40px; mix-blend-mode:lighten; flex-shrink:0; cursor:pointer; }
  .header-page-label { font-size:26px; font-weight:800; color:rgba(255,255,255,0.9); white-space:nowrap; }
  .header-list-link { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.4); border-radius:20px; font-size:13px; font-weight:700; color:#fff; text-decoration:none; white-space:nowrap; backdrop-filter:blur(4px); transition:background .15s; }
  .header-list-link:hover { background:rgba(255,255,255,0.3); }
  .stats { display:inline-flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .stat-badge { background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.4); border-radius:20px; padding:6px 16px; font-size:13px; color:#fff; backdrop-filter:blur(4px); }
  .today-btn { cursor:pointer; font-family:'Pretendard',sans-serif; font-weight:700; transition:background .15s; }
  .today-btn:hover { background:rgba(255,255,255,0.3); }
  .today-btn.active { background:#fff; color:#086266; border-color:#fff; }
  .today-status { max-width:600px; margin:12px auto 0; text-align:center; color:#fff; font-size:13px; opacity:0.9; }
  .soldout-badge { position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.65); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; }
  .card-number { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.55); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; pointer-events:none; }
  .search-box { max-width:1200px; margin:14px auto 0; display:flex; gap:8px; align-items:center; justify-content:flex-start; }
  .search-input-wrap { position:relative; flex:0 1 130px; min-width:0; }
  .search-input-wrap input { width:100%; padding:6px 38px 6px 16px; border-radius:4px; border:none; font-family:'Pretendard',sans-serif; font-size:14px; outline:none; box-sizing:border-box; }
  .search-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:0.55; pointer-events:none; }
  .search-box .today-btn { flex-shrink:0; white-space:nowrap; }
  .search-all-label { font-size:12px; color:rgba(255,255,255,0.85); white-space:nowrap; flex-shrink:0; }
  .search-line { max-width:1200px; margin:10px auto 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-start; }
  .result-count { font-size:12px; color:rgba(255,255,255,0.85); white-space:nowrap; }
  .cat-filter { max-width:1200px; margin:14px auto 0; display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-start; align-items:center; }
  .cat-btn { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4); border-radius:20px; padding:6px 16px; font-size:13px; font-weight:600; color:#fff; cursor:pointer; font-family:'Pretendard',sans-serif; transition:background .15s; }
  .cat-btn:hover { background:rgba(255,255,255,0.28); }
  .cat-btn.active { background:#fff; color:#086266; border-color:#fff; }
  .reserve-event-card { max-width:1200px; margin:14px auto 0; background:linear-gradient(135deg,#086266,#1D9E75); border-radius:14px; padding:12px 18px; cursor:pointer; box-shadow:0 4px 14px rgba(8,98,102,.28); text-align:left; }
  .reserve-event-badge { display:inline-block; background:rgba(255,255,255,.2); color:#fff; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; flex-shrink:0; }
  .reserve-event-name { color:#fff; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .reserve-event-deadline { color:rgba(255,255,255,.85); font-size:11.5px; font-weight:600; flex-shrink:0; }
  .grid { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:18px; }
  .card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,0.12); transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 22px rgba(0,0,0,0.18); }
  .thumb { position:relative; width:100%; aspect-ratio:1/1; background:#f2f2f2; overflow:hidden; }
  .thumb-placeholder { display:flex; align-items:center; justify-content:center; font-size:48px; color:#bbb; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .info { padding:12px 14px 14px; }
  .name { font-size:14px; font-weight:700; color:#0b3c3e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:12px; }
  .cat { background:#eef7f6; color:#086266; border-radius:8px; padding:2px 8px; font-weight:600; }
  .price { color:#b8860b; font-weight:700; }
  .card { cursor:pointer; }
  @media (max-width:980px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px) { .grid { grid-template-columns:repeat(2,1fr); } header h1 { font-size:22px; } }
  footer { max-width:1200px; margin:32px auto 0; text-align:center; color:#fff; opacity:0.85; font-size:12px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(8,20,20,0.75); z-index:999; align-items:center; justify-content:center; padding:24px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#fff; border-radius:16px; max-width:420px; width:100%; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,0.35); position:relative; }
  .modal-close { position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,0.45); color:#fff; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:1; }
  .modal-img { position:relative; width:100%; aspect-ratio:1/1; background:#f2f2f2; }
  .modal-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .ai-img-badge { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; font-size:12px; font-weight:800; padding:5px 14px; border-radius:20px; letter-spacing:.2px; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,.4); white-space:nowrap; }
  .modal-info { padding:18px 20px 22px; }
  .recommend-box { max-width:460px; padding:24px 22px 22px; }
  .recommend-form h3 { font-size:18px; color:#086266; margin-bottom:16px; }
  .rf-group { margin-bottom:16px; }
  .rf-label { display:block; font-size:13px; font-weight:700; color:#555; margin-bottom:8px; }
  .rf-options { display:flex; flex-wrap:wrap; gap:6px; }
  .rf-opt { background:#f2f7f6; border:1.5px solid #d5e6e4; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; color:#086266; cursor:pointer; font-family:inherit; transition:background .12s,border-color .12s; }
  .rf-opt:hover { background:#e0f0ee; }
  .rf-opt.selected { background:#086266; color:#fff; border-color:#086266; }
  .rf-input { width:100%; padding:8px 12px; border-radius:8px; border:1.5px solid #d5e6e4; font-family:inherit; font-size:14px; outline:none; box-sizing:border-box; }
  .rf-input:focus { border-color:#086266; }
  .rf-run-btn { width:100%; padding:12px; background:#086266; color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s; }
  .rf-run-btn:hover { background:#0a7a7f; }
  .rf-run-btn:disabled { background:#aac9c8; cursor:default; }
  .rf-status { margin-top:12px; font-size:13px; color:#086266; text-align:center; }
  .recommend-result h3 { font-size:18px; color:#086266; margin-bottom:14px; }
  .recommend-result-text { font-size:14px; color:#333; line-height:1.6; margin-bottom:20px; white-space:pre-wrap; }
  .edit-child-toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:#555; margin-bottom:14px; cursor:pointer; user-select:none; }
  .edit-divider { border:none; border-top:1px solid #eee; margin:14px 0; }
  .edit-img-btn-row { display:flex; gap:8px; margin-bottom:8px; }
  .edit-img-btn-upload { flex:1; background:#086266; color:#fff; border:none; border-radius:10px; padding:10px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
  .edit-img-btn-delete { background:#fff; color:#e05; border:1.5px solid #f5c0c0; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
  .edit-img-status { display:none; text-align:center; padding:6px 0; font-size:13px; color:#086266; margin-bottom:6px; }
  .edit-img-preview { width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:#f0faf9; border:1.5px dashed #cde8e7; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .edit-img-preview img { width:100%; height:100%; object-fit:cover; }
  .edit-close-btn { flex:1; background:#eee; color:#555; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .modal-name { font-size:19px; font-weight:700; color:#0b3c3e; margin-bottom:8px; }
  .modal-meta { display:flex; align-items:center; gap:10px; }
  .modal-meta .cat { font-size:13px; }
  .modal-meta .price { font-size:17px; }
</style>
</head>
<body>

    <div class="header-top">
      <div class="header-title">

  <script>
    // 관리자 인증 상태(index.html/menu-manager.html과 같은 방식) — 인증된 기기에서만 카드 클릭 시 편집 가능
    const ONBAN_ADMIN_KEY = 'onban@1dl34';
    const isAdmin = localStorage.getItem('onban_admin_auth') === ('ok_' + ONBAN_ADMIN_KEY);
    const IMGBB_KEY = 'b5a6e9481bb9cb4791108cf50761a459';
    const searchAllInput = document.getElementById('searchAllInput');
    const searchCatInput = document.getElementById('searchCatInput');
    const grid = document.getElementById('grid');
    let cards = [];
    function escapeHtml(s) {
      return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function cardHtml(m) {
      var thumbHtml = m.imgUrl
        ? '<div class="thumb"><img src="' + escapeHtml(m.imgUrl) + '" alt="' + escapeHtml(m.name) + '" loading="lazy"></div>'
        : '<div class="thumb thumb-placeholder">🍽️</div>';
      return '<div class="card" data-menu-id="' + (m.menuId || '') + '">'
        + thumbHtml
        + '<div class="info">'
          + '<div class="name">' + escapeHtml(m.name) + '</div>'
          + '<div class="meta"><span class="cat">' + escapeHtml(m.cat || '기타') + '</span><span class="price">' + (Number(m.price) || 0) + '천원</span></div>'
        + '</div>'
        + '</div>';
    }
    let menusCache = []; // menuId -> 원본 필드(child/desc/icon 등, 카드 DOM엔 없는 값) 조회용
    function renderCards(menus) {
      menusCache = menus;
      grid.innerHTML = menus.map(cardHtml).join('');
      cards = document.querySelectorAll('.card');
      cards.forEach(c => c.addEventListener('click', () => cardClick(c)));
    }
    // 마스터 메뉴(실시간)에서 카드 목록을 그려냄 — 사진 없는 항목은 플레이스홀더로 표시
    function loadCardsFromServer(cb) {
      fetch(API_URL + '/api/menu/all', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          const menus = (d && d.success && Array.isArray(d.menus)) ? d.menus : [];
          renderCards(menus);
          if (cb) cb();
        })
        .catch(() => { if (cb) cb(); });
    }
    function getCatBtns() { return document.querySelectorAll('.cat-btn'); }
    let activeCat = '전체';
    let recommendPicks = null; // Set<string> | null — AI 추천 결과로 필터링 중일 때
    function applyFilter() {
      const qAll = searchAllInput.value.trim().toLowerCase();
      const qCat = searchCatInput.value.trim().toLowerCase();
      const searching = !!(qAll || qCat);
      let visibleCount = 0;
      cards.forEach(c => {
        const name = c.querySelector('.name').textContent;
        const cat = c.querySelector('.cat').textContent;
        let show;
        if (recommendPicks) {
          // AI 추천 모드: 추천받은 메뉴만
          show = recommendPicks.has(name);
        } else if (qAll) {
          // 전체 검색: 카테고리 무관, 이름만 매치
          show = name.toLowerCase().includes(qAll);
        } else if (qCat) {
          // 카테고리내 검색: 현재 선택된 카테고리 안에서만 이름 매치
          show = name.toLowerCase().includes(qCat) && (activeCat === '전체' || cat === activeCat);
        } else {
          const matchCat = activeCat === '전체' || cat === activeCat;
          const matchToday = !todayMode || (todayMap && todayMap.has(name));
          show = matchCat && matchToday;
        }
        c.style.display = show ? '' : 'none';
        if (show) {
          visibleCount++;
          let numEl = c.querySelector('.card-number');
          if (!numEl) {
            numEl = document.createElement('span');
            numEl.className = 'card-number';
            c.querySelector('.thumb').appendChild(numEl);
          }
          numEl.textContent = visibleCount;
        }
      });
      document.getElementById('emptyState').style.display = visibleCount ? 'none' : '';
      document.getElementById('resultCount').textContent = visibleCount + '개';
      if (searching || recommendPicks) {
        todayBtn.classList.remove('active');
        reserveBtn.classList.remove('active');
      } else {
        todayBtn.classList.toggle('active', todayMode);
        reserveBtn.classList.toggle('active', reserveMode);
      }
      recommendBtn.classList.toggle('active', !!recommendPicks);
    }
    searchAllInput.addEventListener('input', applyFilter);
    searchCatInput.addEventListener('input', applyFilter);
    // 카테고리 버튼은 서버에서 동적으로 추가되므로, 개별 바인딩 대신 상위 컨테이너에
    // 이벤트 위임으로 한 번만 등록 — 나중에 추가되는 버튼에도 자동으로 적용됨
    document.getElementById('catFilter').addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      getCatBtns().forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      searchCatInput.value = '';
      if (todayMode) {
        todayMode = false;
        todayStatus.style.display = 'none';
        cards.forEach(c => { c.style.opacity = ''; const b = c.querySelector('.soldout-badge'); if (b) b.remove(); });
      }
      reserveMode = false;
      exitRecommendMode(false);
      applyFilter();
    });

    const modalOverlay = document.getElementById('modalOverlay');
    const modalImg = document.getElementById('modalImg');
    const modalAiBadge = document.getElementById('modalAiBadge');
    const modalName = document.getElementById('modalName');
    const modalCat = document.getElementById('modalCat');
    const modalPrice = document.getElementById('modalPrice');
    function isAiImg(src) { return !!(src && src.startsWith('https://d8j0ntlcm91z4.cloudfront.net')); }
    function openModal(card) {
      const img = card.querySelector('.thumb img');
      if (img) {
        modalImg.style.display = '';
        modalImg.src = img.src;
        modalImg.alt = img.alt;
        modalAiBadge.style.display = isAiImg(img.src) ? '' : 'none';
      } else {
        modalImg.style.display = 'none';
        modalImg.removeAttribute('src');
        modalAiBadge.style.display = 'none';
      }
      modalName.textContent = card.querySelector('.name').textContent;
      modalCat.textContent = card.querySelector('.cat').textContent;
      modalPrice.textContent = card.querySelector('.price').textContent;
      modalOverlay.classList.add('open');
    }
    function closeModal() { modalOverlay.classList.remove('open'); }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeRecommendModal(); closeRecommendResultModal(); closeEditPopup(); } });

    // ── 오늘의 메뉴 모드 ──
    const API_URL = 'https://myfood01-production.up.railway.app';
    const todayBtn = document.getElementById('todayBtn');
    const todayStatus = document.getElementById('todayStatus');
    const catFilter = document.getElementById('catFilter');
    let todayMode = false;
    let todayMap = null; // name -> {price, stock, cat}
    let reserveMode = false;
    const reserveBtn = document.getElementById('reserveBtn');
    const recommendBtn = document.getElementById('recommendBtn');

    function todayISO() {
      const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
      return kst.toISOString().slice(0, 10);
    }

    function cardClick(card) {
      const name = card.querySelector('.name').textContent;
      if (todayMode) {
        const info = todayMap && todayMap.get(name);
        if (info && info.stock <= 0) return; // 품절 클릭 무시
        window.location.href = 'onban01.html?openMenu=' + encodeURIComponent(name);
      } else if (reserveMode) {
        // '예약 주문 신청하기'와 동일한 기능 — 예약주문 페이지에서 해당 항목을 바로 선택해 팝업까지 오픈
        window.location.href = 'onban01.html?openReserve=' + encodeURIComponent(name);
      } else if (isAdmin) {
        openEditPopup(card);
      } else {
        openModal(card);
      }
    }

    function applyTodayView() {
      cards.forEach(c => {
        const name = c.querySelector('.name').textContent;
        const info = todayMap.get(name);
        const oldBadge = c.querySelector('.soldout-badge');
        if (oldBadge) oldBadge.remove();
        if (!info) { c.style.opacity = ''; return; }
        c.querySelector('.price').textContent = info.price + '천원';
        if (info.stock <= 0) {
          const b = document.createElement('span');
          b.className = 'soldout-badge';
          b.textContent = '품절';
          c.querySelector('.thumb').appendChild(b);
          c.style.opacity = '0.55';
        } else {
          c.style.opacity = '';
        }
      });
      applyFilter();
    }

    function exitTodayMode() {
      todayMode = false;
      todayBtn.classList.remove('active');
      todayStatus.style.display = 'none';
      catFilter.style.display = '';
      searchAllInput.value = '';
      searchCatInput.value = '';
      cards.forEach(c => {
        c.style.opacity = '';
        const b = c.querySelector('.soldout-badge');
        if (b) b.remove();
      });
      activeCat = '전체';
      getCatBtns().forEach(b => b.classList.remove('active'));
      getCatBtns()[0].classList.add('active');
      exitRecommendMode(false);
      applyFilter();
    }

    var galleryToastEl = null;
    function showGalleryToast(msg) {
      if (!galleryToastEl) {
        galleryToastEl = document.createElement('div');
        galleryToastEl.id = 'gallery-toast';
        galleryToastEl.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9999;white-space:nowrap;';
        document.body.appendChild(galleryToastEl);
      }
      galleryToastEl.textContent = msg;
      galleryToastEl.style.opacity = '1';
      clearTimeout(galleryToastEl._hideTimer);
      galleryToastEl._hideTimer = setTimeout(() => { galleryToastEl.style.opacity = '0'; }, 2000);
    }
    todayBtn.addEventListener('click', () => {
      if (todayMode) { exitTodayMode(); return; }
      if (reserveMode) exitReserveMode();
      exitRecommendMode(false);
      todayStatus.style.display = 'block';
      todayStatus.textContent = '오늘의 메뉴를 불러오는 중...';
      fetch(API_URL + '/api/menu/' + todayISO(), { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          todayStatus.style.display = 'none';
          todayMap = new Map();
          if (d.success && Array.isArray(d.menus)) {
            d.menus.forEach(m => todayMap.set(m.name, { price: Number(m.price) || 0, stock: Number(m.stock) || 0, cat: m.cat || '기타' }));
          }
          todayMode = true;
          todayBtn.classList.add('active');
          applyTodayView();
          if (!todayMap.size) showGalleryToast('📅 오늘 등록된 메뉴가 없어요.');
        })
        .catch(() => { todayStatus.textContent = '오늘의 메뉴를 불러오지 못했어요.'; });
    });

    function exitReserveMode() {
      reserveMode = false;
      reserveBtn.classList.remove('active');
      todayStatus.style.display = 'none';
    }
    reserveBtn.addEventListener('click', () => {
      if (reserveMode) { exitReserveMode(); return; }
      if (todayMode) exitTodayMode();
      exitRecommendMode(false);
      reserveMode = true;
      reserveBtn.classList.add('active');
    });

    // ── 오늘의 추천 메뉴(AI) ──
    const recommendOverlay = document.getElementById('recommendOverlay');
    let rfCuisineVal = '';
    const rfDrinksVal = new Set();
    document.getElementById('rfCuisine').addEventListener('click', (e) => {
      const btn = e.target.closest('.rf-opt');
      if (!btn) return;
      const already = btn.classList.contains('selected');
      document.querySelectorAll('#rfCuisine .rf-opt').forEach(b => b.classList.remove('selected'));
      if (!already) { btn.classList.add('selected'); rfCuisineVal = btn.dataset.val; }
      else { rfCuisineVal = ''; }
    });
    document.getElementById('rfDrinks').addEventListener('click', (e) => {
      const btn = e.target.closest('.rf-opt');
      if (!btn) return;
      btn.classList.toggle('selected');
      if (btn.classList.contains('selected')) rfDrinksVal.add(btn.dataset.val);
      else rfDrinksVal.delete(btn.dataset.val);
    });
    function openRecommendModal() { recommendOverlay.classList.add('open'); }
    function closeRecommendModal() { recommendOverlay.classList.remove('open'); }
    recommendBtn.addEventListener('click', openRecommendModal);
    document.getElementById('recommendClose').addEventListener('click', closeRecommendModal);
    recommendOverlay.addEventListener('click', (e) => { if (e.target === recommendOverlay) closeRecommendModal(); });

    // 추천 결과를 알려주는 팝업 — AI 메시지를 배너가 아니라 별도 창으로 제시
    const recommendResultOverlay = document.getElementById('recommendResultOverlay');
    const recommendResultText = document.getElementById('recommendResultText');
    function openRecommendResultModal(reason) {
      recommendResultText.textContent = reason || '요청하신 조건에 맞는 메뉴예요.';
      recommendResultOverlay.classList.add('open');
    }
    function closeRecommendResultModal() { recommendResultOverlay.classList.remove('open'); }
    document.getElementById('recommendResultClose').addEventListener('click', closeRecommendResultModal);
    document.getElementById('recommendResultOk').addEventListener('click', closeRecommendResultModal);
    recommendResultOverlay.addEventListener('click', (e) => { if (e.target === recommendResultOverlay) closeRecommendResultModal(); });

    function applyRecommendMode(picks, reason) {
      recommendPicks = new Set(picks);
      if (todayMode) {
        todayMode = false;
        todayBtn.classList.remove('active');
        todayStatus.style.display = 'none';
        cards.forEach(c => { c.style.opacity = ''; const b = c.querySelector('.soldout-badge'); if (b) b.remove(); });
      }
      if (reserveMode) exitReserveMode();
      searchAllInput.value = '';
      searchCatInput.value = '';
      activeCat = '전체';
      getCatBtns().forEach(b => b.classList.remove('active'));
      applyFilter();
      openRecommendResultModal(reason);
    }
    function exitRecommendMode(doApplyFilter) {
      if (!recommendPicks) return;
      recommendPicks = null;
      recommendBtn.classList.remove('active');
      if (doApplyFilter !== false) applyFilter();
    }
    document.getElementById('rfRun').addEventListener('click', () => {
      const runBtn = document.getElementById('rfRun');
      const status = document.getElementById('rfStatus');
      const servings = Number(document.getElementById('rfServings').value) || 0;
      const ingredients = document.getElementById('rfIngredients').value.trim();
      runBtn.disabled = true;
      status.style.display = 'block';
      status.textContent = 'AI가 메뉴를 고르는 중...';
      fetch(API_URL + '/api/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cuisine: rfCuisineVal,
          servings: servings,
          ingredients: ingredients,
          drinks: Array.from(rfDrinksVal),
        }),
      })
        .then(r => r.json())
        .then(d => {
          runBtn.disabled = false;
          if (!d.success || !d.picks || !d.picks.length) {
            status.textContent = d.error || '조건에 맞는 메뉴를 찾지 못했어요. 조건을 바꿔보세요.';
            return;
          }
          status.style.display = 'none';
          applyRecommendMode(d.picks, d.reason);
          closeRecommendModal();
        })
        .catch(() => {
          runBtn.disabled = false;
          status.textContent = '추천 요청에 실패했어요. 다시 시도해주세요.';
        });
    });

    // 예약 이벤트 안내 카드 — 카테고리 메뉴 다음 줄에 표시, 클릭 시 예약주문 페이지에서 이벤트 신청 팝업 자동 오픈(기존 기능 재사용)
    function fmtEventDate(iso) {
      var p = (iso || '').split('-');
      return p.length >= 3 ? (p[1] + '/' + p[2]) : (iso || '');
    }
    function loadReserveEventCard() {
      fetch(API_URL + '/api/settings', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          var ev = (d && d.success && d.data && d.data.reserveEvent) || null;
          var todayStr = todayISO();
          var el = document.getElementById('reserveEventCard');
          if (!ev || !ev.name || !ev.deadline || ev.deadline < todayStr) { el.innerHTML = ''; return; }
          var safeDesc = (ev.desc || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          el.innerHTML = '<div class="reserve-event-card" onclick="window.location.href=\'onban01.html?openReserveEvent=1\'">'
            + '<div style="display:flex;align-items:center;gap:8px;">'
            + '<span class="reserve-event-badge">🎉 예약 이벤트</span>'
            + '<span class="reserve-event-name">' + safeDesc + '</span>'
            + '<span class="reserve-event-deadline">~' + fmtEventDate(ev.deadline) + ' 까지</span>'
            + '</div></div>';
        })
        .catch(() => {});
    }
    loadReserveEventCard();

    // 카테고리 탭 — 하드코딩 대신 서버 categories 테이블에서 동적으로 불러와 렌더링
    function loadCategoriesFromServer() {
      fetch(API_URL + '/api/settings', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          var cats = (d && d.success && d.data && d.data.categories) || [];
          if (!cats.length) return;
          cats.forEach(function (c) {
            var btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.dataset.cat = c.name;
            btn.textContent = c.name;
            catFilter.appendChild(btn);
          });
        })
        .catch(() => {});
    }
    loadCategoriesFromServer();

    // ── 관리자 메뉴 편집(마스터 단건 수정) — isAdmin일 때만 카드 클릭이 여기로 옴 ──
    const editOverlay = document.getElementById('editOverlay');
    let editTargetId = null;
    let editPendingImgUrl = null;

    function populateEditCatSelect(selected) {
      var sel = document.getElementById('editCat');
      var names = Array.from(getCatBtns()).map(b => b.dataset.cat).filter(c => c && c !== '전체');
      sel.innerHTML = names.map(c => '<option value="' + escapeHtml(c) + '"' + (c === selected ? ' selected' : '') + '>' + escapeHtml(c) + '</option>').join('');
    }
    function setEditImgPreview(url) {
      var w = document.getElementById('editImgPreviewWrap');
      if (url) { w.innerHTML = '<img src="' + escapeHtml(url) + '" alt="미리보기">'; }
      else { w.innerHTML = '<span style="font-size:26px;">🍽️</span>'; }
    }
    function setEditImgStatus(msg, loading) {
      var el = document.getElementById('editImgStatus');
      var btn = document.getElementById('editImgUploadBtn');
      el.textContent = msg; el.style.display = msg ? 'block' : 'none'; btn.disabled = loading;
    }
    function openEditPopup(card) {
      var id = Number(card.dataset.menuId);
      var m = menusCache.find(x => x.menuId === id);
      if (!m) return;
      editTargetId = id;
      editPendingImgUrl = null;
      document.getElementById('editTitle').textContent = '메뉴 편집 — ' + m.name;
      document.getElementById('editName').value = m.name || '';
      document.getElementById('editPrice').value = m.price || 0;
      document.getElementById('editStock').value = m.stock || 0;
      populateEditCatSelect(m.cat || '기타');
      document.getElementById('editChild').checked = !!m.child;
      document.getElementById('editDesc').value = m.desc || '';
      document.getElementById('editImgUrl').value = m.imgUrl || '';
      setEditImgPreview(m.imgUrl || null);
      setEditImgStatus('', false);
      document.getElementById('editImgUploadBtn').textContent = m.imgUrl ? '📁 사진 변경' : '📁 사진 선택';
      document.getElementById('editImgDeleteBtn').style.display = m.imgUrl ? '' : 'none';
      document.getElementById('editImgFileInput').value = '';
      editOverlay.classList.add('open');
    }
    function closeEditPopup() {
      editOverlay.classList.remove('open');
      editTargetId = null;
      editPendingImgUrl = null;
    }
    document.getElementById('editClose').addEventListener('click', closeEditPopup);
    document.getElementById('editCancelBtn').addEventListener('click', closeEditPopup);
    editOverlay.addEventListener('click', (e) => { if (e.target === editOverlay) closeEditPopup(); });
    document.getElementById('editImgUrl').addEventListener('input', (e) => { setEditImgPreview(e.target.value || null); });
    document.getElementById('editImgUploadBtn').addEventListener('click', () => { document.getElementById('editImgFileInput').click(); });
    document.getElementById('editImgDeleteBtn').addEventListener('click', () => {
      document.getElementById('editImgUrl').value = '';
      editPendingImgUrl = null;
      setEditImgPreview(null);
      document.getElementById('editImgUploadBtn').textContent = '📁 사진 선택';
      document.getElementById('editImgDeleteBtn').style.display = 'none';
    });

    function onEditImgFileSelected(e) {
      var file = e.target.files[0];
      if (!file) return;
      setEditImgStatus('이미지 준비 중...', true);
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var MAX = 600, w = img.width, h = img.height;
          if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          uploadEditImgBB(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }
    function uploadEditImgBB(b64) {
      setEditImgStatus('업로드 중...', true);
      var form = new FormData();
      form.append('key', IMGBB_KEY);
      form.append('image', b64);
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.imgbb.com/1/upload', true);
      xhr.onload = function () {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.success) {
              var url = data.data.url;
              editPendingImgUrl = url;
              document.getElementById('editImgUrl').value = url;
              setEditImgPreview(url);
              setEditImgStatus('업로드 완료! 저장 버튼으로 적용하세요.', false);
              document.getElementById('editImgDeleteBtn').style.display = '';
            } else {
              setEditImgStatus('업로드 실패: ' + ((data.error && data.error.message) || '알 수 없는 오류'), false);
            }
          } catch (e) { setEditImgStatus('응답 파싱 오류: ' + e.message, false); }
        } else { setEditImgStatus('서버 오류 (HTTP ' + xhr.status + ')', false); }
      };
      xhr.onerror = function () { setEditImgStatus('연결 실패 — 인터넷 연결을 확인해주세요.', false); };
      xhr.ontimeout = function () { setEditImgStatus('업로드 시간 초과. 다시 시도해주세요.', false); };
      xhr.timeout = 30000;
      xhr.send(form);
    }
    document.getElementById('editImgFileInput').addEventListener('change', onEditImgFileSelected);

    function updateCardAfterEdit(id, payload) {
      var m = menusCache.find(x => x.menuId === id);
      if (m) Object.assign(m, payload);
      var card = Array.from(cards).find(c => Number(c.dataset.menuId) === id);
      if (!card) return;
      card.querySelector('.name').textContent = payload.name;
      card.querySelector('.cat').textContent = payload.cat || '기타';
      card.querySelector('.price').textContent = payload.price + '천원';
      var thumb = card.querySelector('.thumb');
      if (payload.imgUrl) {
        thumb.className = 'thumb';
        thumb.innerHTML = '<img src="' + escapeHtml(payload.imgUrl) + '" alt="' + escapeHtml(payload.name) + '" loading="lazy">';
      } else {
        thumb.className = 'thumb thumb-placeholder';
        thumb.innerHTML = '🍽️';
      }
      applyFilter(); // card-number 배지 등 재계산
    }
    document.getElementById('editSaveBtn').addEventListener('click', () => {
      if (editTargetId === null) return;
      var name = document.getElementById('editName').value.trim();
      if (!name) { alert('메뉴명을 입력해주세요.'); return; }
      var saveBtn = document.getElementById('editSaveBtn');
      var payload = {
        id: editTargetId,
        name: name,
        price: parseInt(document.getElementById('editPrice').value) || 0,
        stock: parseInt(document.getElementById('editStock').value) || 0,
        cat: document.getElementById('editCat').value,
        child: document.getElementById('editChild').checked,
        desc: document.getElementById('editDesc').value.trim(),
        imgUrl: editPendingImgUrl || document.getElementById('editImgUrl').value.trim() || '',
      };
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
      fetch(API_URL + '/api/menu/master/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': ONBAN_ADMIN_KEY },
        body: JSON.stringify(payload),
      })
        .then(r => r.json())
        .then(d => {
          saveBtn.disabled = false;
          saveBtn.textContent = '저장';
          if (!d.success) { alert('저장 실패: ' + (d.error || '')); return; }
          updateCardAfterEdit(editTargetId, payload);
          closeEditPopup();
        })
        .catch(() => {
          saveBtn.disabled = false;
          saveBtn.textContent = '저장';
          alert('저장 요청에 실패했어요. 다시 시도해주세요.');
        });
    });

    loadCardsFromServer(applyFilter);
  </script>
</body>
</html>

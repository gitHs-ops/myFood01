function renderHistory(){
  var el=document.getElementById('historyContent');
  el.innerHTML='<div style="text-align:center;padding:40px;color:#aaa;font-size:13px;">불러오는 중...</div>';
  var did=getDeviceId();
  Promise.all([
    fetch(API_URL+'/api/orders?date='+encodeURIComponent(menuDate)+'&deviceId='+encodeURIComponent(did),{cache:'no-store'}).then(function(r){return r.json();}),
    fetch(API_URL+'/api/orders?deviceId='+encodeURIComponent(did)+'&reservedForDevice=1',{cache:'no-store'}).then(function(r){return r.json();})
  ])
  .then(function(results){
    var byId={};
    (results[0].success&&Array.isArray(results[0].orders)?results[0].orders:[]).forEach(function(o){byId[o.id]=o;});
    (results[1].success&&Array.isArray(results[1].orders)?results[1].orders:[]).forEach(function(o){byId[o.id]=o;});
    var fetched=Object.values(byId);
    if(fetched.length||results[0].success){
      var all=JSON.parse(localStorage.getItem('orders')||'[]');
      var dbIds={};
      fetched.forEach(function(go){
        dbIds[go.id]=true;
        var i=all.findIndex(function(o){return o.id===go.id;});
        if(i>=0){
          // items(수량) 유지 — 나머지는 DB 동기화
          all[i].status=go.status;
          if(go.memo!==undefined)all[i].memo=go.memo;
          if(go.adminReply!==undefined)all[i].adminReply=go.adminReply;
          if(go.replyAt!==undefined)all[i].replyAt=go.replyAt;
          if(go.additionalRequest!==undefined)all[i].additionalRequest=go.additionalRequest;
          if(go.reserveDate!==undefined)all[i].reserveDate=go.reserveDate;
          if(go.date!==undefined)all[i].date=go.date;
        } else {
          all.push(go);
        }
      });
      // phantom 주문 제거 (DB에 없는 localStorage 전용 항목) — 오늘자 주문 + 예약주문(reservedForDevice로 전량 조회됨) 대상
      // 예약주문이 아닌 과거 일반 주문은 위 두 조회 범위 밖이라 그대로 유지
      all=all.filter(function(o){var relevant=(o.date===menuDate)||!!o.reserveDate;return !relevant||dbIds[o.id];});
      _migrateLegacyMemo(all);   // 레거시 memo 인라인 노트 → additionalRequest 이관
      localStorage.setItem('orders',JSON.stringify(all));
    }
    _doRenderHistory(el);
  })
  .catch(function(){
    el.innerHTML='<div class="hist-empty"><span>📶</span><p>네트워크 오류가 발생했어요.<br>'
      +'<button onclick="renderHistory()" style="margin-top:10px;padding:7px 20px;border-radius:20px;border:none;background:#086266;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">다시 시도</button></p></div>';
  });
}
var _ORDER_STATUS_MAP={pending:'대기중',confirmed:'주문접수',delivered:'배송완료',cancelled:'취소됨','예약주문':'예약주문'};
var _ORDER_STATUS_CLS={pending:'pending',confirmed:'confirmed',delivered:'delivered',cancelled:'cancelled','예약주문':'reserve'};
function _doRenderHistory(el){
  el.innerHTML='';
  var all=JSON.parse(localStorage.getItem('orders')||'[]');
  var orders=all.filter(function(o){return o.date===menuDate||!!o.reserveDate;});
  if(!orders.length){
    var label=new Date(menuDate+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
    el.innerHTML='<div class="hist-empty"><span>📋</span><p>'+label+' 주문 내역이 없어요.</p></div>';
    return;
  }
  var listWrap=document.createElement('div');
  listWrap.className='hist-list';
  orders.forEach(function(o){
    var itemsSum=o.items.reduce(function(s,i){return s+i.price*i.qty;},0);
    var isPickupMemo=(o.memo||'').startsWith('매장픽업');
    var deliveryFee=(!isPickupMemo&&itemsSum>=20)?1:0;
    var total=itemsSum+deliveryFee;
    var summary=(o.items[0]?menuDisplayName(o.items[0].name,o.items[0].cat||_itemCat(o.items[0].name)):'')+(o.items.length>1?' 외 '+(o.items.length-1)+'건':'');
    var isReserveOrder=!!o.reserveDate;
    var reserveLabel=isReserveOrder?'<span style="color:#e53935;font-weight:700;font-size:11px;margin-left:4px;">예약주문 '+fmtDate(o.reserveDate)+'</span>':'';
    var rowEl=document.createElement('div');
    rowEl.className='hist-li';
    rowEl.innerHTML=
      '<div class="hist-li-main">'
        +'<div class="hist-li-top"><span class="hist-status '+(_ORDER_STATUS_CLS[o.status]||'pending')+'">'+(_ORDER_STATUS_MAP[o.status]||'대기중')+'</span><span class="hist-li-dt">'+fmtDT(o.date,o.time)+'</span>'+reserveLabel+'</div>'
        +'<div class="hist-li-sum"><span class="hist-li-sum-text">'+summary+'</span><span class="hist-li-arrow">›</span></div>'
        +(o.additionalRequest?'<div class="hist-li-addreq">💬 '+o.additionalRequest.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\n\r]+/g,'<br>')+'</div>':'')
        +(o.adminReply?'<div class="hist-li-reply">↩ '+o.adminReply.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;br&gt;/gi,'<br>').replace(/[\n\r]+/g,'<br>')+'</div>':'')
      +'</div>'
      +'<div class="hist-li-right"><span class="hist-li-total">'+comma(total)+'천원</span></div>';
    (function(oid){rowEl.onclick=function(){openOrderDetail(oid);};})(o.id);
    listWrap.appendChild(rowEl);
  });
  el.appendChild(listWrap);
}
// 주문 상세 카드 1건 생성 (팝업에 주입) — 기존 카드 UI/기능 그대로
function _buildOrderCard(o){
  var statusMap=_ORDER_STATUS_MAP,statusCls=_ORDER_STATUS_CLS;
    var itemsSum=o.items.reduce(function(s,i){return s+i.price*i.qty;},0);
    var isPickupMemo=(o.memo||'').startsWith('매장픽업');
    var deliveryFee=(!isPickupMemo&&itemsSum>=20)?1:0;
    var total=itemsSum+deliveryFee;
    var canEditDelivery=(o.status==='pending'); // 배송방법 변경은 대기중(주문 확정 전)에만 허용
    var canEditExtra=(o.status!=='cancelled'); // 추가요청사항은 취소된 주문만 아니면 계속 편집 가능(주문접수·배송완료 동일)
    var card=document.createElement('div');
    card.className='hist-card';
    card.id='histcard-'+o.id;
    card.dataset.deliveryFee=deliveryFee;
    // 헤더
    var head=document.createElement('div');
    head.className='hist-head';
    var isReserveOrderD=!!o.reserveDate;
    var reserveLabelD=isReserveOrderD?'<span style="color:#e53935;font-weight:700;font-size:11px;margin-left:4px;">예약주문 '+fmtDate(o.reserveDate)+'</span>':'';
    head.innerHTML='<span class="hist-date">'+fmtDT(o.date,o.time)+'</span>'+reserveLabelD
      +'<span style="display:inline-flex;align-items:center;gap:3px;"><span class="hist-status '+(statusCls[o.status]||'pending')+'">'+(statusMap[o.status]||'대기중')+'</span></span>';
    card.appendChild(head);
    // 아이템 목록
    var body=document.createElement('div');
    body.className='hist-body';
    body.id='histbody-'+o.id;
    o.items.forEach(function(item){
      var key=item.name.replace(/\s/g,'_');
      var row=document.createElement('div');
      row.className='hist-item-row';
      row.id='histrow-'+o.id+'-'+key;
      var nm=document.createElement('span');
      nm.className='hist-item-name';
      nm.textContent=menuDisplayName(item.name,item.cat||_itemCat(item.name));
      var pr=document.createElement('span');
      pr.className='hist-item-price';
      pr.id='histprice-'+o.id+'-'+key;
      pr.textContent=comma(item.price*item.qty)+'천원';
      row.appendChild(nm);
      if(o.status==='pending'){
        var qtyCtrl=document.createElement('div');
        qtyCtrl.className='hist-item-qty-ctrl';
        var qm=document.createElement('button'); qm.textContent='-';
        (function(oid,iname){qm.onclick=function(){histEditQty(oid,iname,-1);};})(o.id,item.name);
        var qs=document.createElement('span'); qs.textContent=item.qty;
        qs.id='histqty-'+o.id+'-'+key;
        var qp=document.createElement('button'); qp.textContent='+';
        (function(oid,iname){qp.onclick=function(){histEditQty(oid,iname,1);};})(o.id,item.name);
        qtyCtrl.appendChild(qm); qtyCtrl.appendChild(qs); qtyCtrl.appendChild(qp);
        var del=document.createElement('button');
        del.className='hist-item-del'; del.textContent='✕';
        (function(oid,iname){del.onclick=function(){histDelItem(oid,iname);};})(o.id,item.name);
        row.appendChild(qtyCtrl); row.appendChild(del);
      }
      row.appendChild(pr);
      body.appendChild(row);
    });
    card.appendChild(body);
    // 배달료 (항상 렌더 — _updateHistTotal로 show/hide)
    var feeRow=document.createElement('div');
    feeRow.id='histfee-'+o.id;
    feeRow.className='order-delivery-fee-row';
    feeRow.style.display=deliveryFee>0?'flex':'none';
    feeRow.innerHTML='<span>🚚 배달료</span><span>+1천원</span>';
    card.appendChild(feeRow);
    // 합계
    var totRow=document.createElement('div');
    totRow.className='hist-total';
    totRow.id='histtotal-'+o.id;
    totRow.innerHTML='<span>합계</span><span class="hist-total-val">'+comma(total)+'천원</span>';
    card.appendChild(totRow);
    // 배송방법 (memo) — 대기중일 때만 변경 가능, 주문접수 이후(주문접수/배송완료/취소됨)엔 주문 당시 값만 표시
    if(canEditDelivery){
      var memoWrap=document.createElement('div');
      memoWrap.className='hist-req-wrap';
      memoWrap.id='histmemo-'+o.id;
      memoWrap.innerHTML=_histMemoHtml(o.id, o.memo||'');
      card.appendChild(memoWrap);
    } else {
      var delivery=(o.memo||'').split(' / ')[0].trim();
      if(delivery){
        var mr=document.createElement('div');
        mr.className='order-memo-row';
        mr.textContent='🚚 '+delivery;
        card.appendChild(mr);
      }
    }
    // 추가요청사항 (additionalRequest) — 취소된 주문이 아니면 계속 편집 가능(주문접수/배송완료 동일)
    if(canEditExtra){
      var extraWrap=document.createElement('div');
      extraWrap.className='hist-req-wrap';
      extraWrap.id='histextra-'+o.id;
      extraWrap.innerHTML=_histExtraHtml(o.id, o.additionalRequest||'');
      card.appendChild(extraWrap);
    } else {
      if(o.additionalRequest){
        var ar=document.createElement('div');
        ar.className='hist-req-wrap';
        ar.innerHTML='<div class="hist-extra-card-section"><span class="hist-extra-label">추가요청사항</span>'
          +'<div class="hist-extra-card-row"><div class="hist-extra-bubble">'
          +o.additionalRequest.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')
          +'</div></div></div>';
        card.appendChild(ar);
      }
    }
    // 관리자 답변 — 모든 상태에서 표시
    if(o.adminReply){
      var repDiv=document.createElement('div');
      repDiv.className='admin-reply-section';
      var safeR=String(o.adminReply).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;br&gt;/gi,'<br>');
      var tStr='';
      if(o.replyAt){try{var rd=new Date(o.replyAt);if(!isNaN(rd.getTime()))tStr=rd.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}catch(e){}}
      repDiv.innerHTML='<div class="admin-reply-header">💬 온반 답변</div>'
        +'<div class="admin-reply-bubble">'
        +'<div class="admin-reply-text">'+safeR+'</div>'
        +(tStr?'<div class="admin-reply-time">'+tStr+'</div>':'')
        +'</div>';
      card.appendChild(repDiv);
    }
    // 액션 버튼
    var acts=document.createElement('div');
    acts.className='hist-actions';
    if(o.status==='cancelled'){
      var btnDel=document.createElement('button');
      btnDel.className='hist-btn-delete';
      btnDel.textContent='삭제';
      (function(oid){btnDel.onclick=function(){deleteHistOrder(oid);};})(o.id);
      acts.appendChild(btnDel);
      var btnCloseD=document.createElement('button');
      btnCloseD.className='hist-btn-cancel';
      btnCloseD.textContent='닫기';
      btnCloseD.onclick=function(){closeOrderDetail();};
      acts.appendChild(btnCloseD);
    } else if(o.status==='pending'){
      var btnOrderCancel=document.createElement('button');
      btnOrderCancel.className='hist-btn-order-cancel';
      btnOrderCancel.textContent='주문취소';
      (function(oid){btnOrderCancel.onclick=function(){cancelHistOrder(oid);};})(o.id);
      acts.appendChild(btnOrderCancel);
      var btnSave=document.createElement('button');
      btnSave.className='hist-btn-save';
      btnSave.textContent='저장';
      (function(oid){btnSave.onclick=function(){histSaveItemsNow(oid);};})(o.id);
      acts.appendChild(btnSave);
      var btnCloseR=document.createElement('button');
      btnCloseR.className='hist-btn-cancel';
      btnCloseR.textContent='닫기';
      btnCloseR.onclick=function(){_closeOrderDetailGuarded();};
      acts.appendChild(btnCloseR);
    } else if(o.status==='confirmed'||o.status==='delivered'){
      // 주문접수/배송완료는 팝업 기능이 동일해야 함(상단 상태 라벨만 다름) — 닫기 버튼만 제공
      var btnCloseC=document.createElement('button');
      btnCloseC.className='hist-btn-cancel';
      btnCloseC.textContent='닫기';
      btnCloseC.onclick=function(){closeOrderDetail();};
      acts.appendChild(btnCloseC);
    }
    card.appendChild(acts);
  return card;
}
// 주문 상세 팝업 열기 — 클릭한 주문의 카드를 모달에 주입
function openOrderDetail(id){
  _detailOrderId=id;
  var orders=JSON.parse(localStorage.getItem('orders')||'[]');
  var o=orders.find(function(x){return x.id===id;});
  if(!o)return;
  var modal=document.getElementById('orderDetailModal');
  modal.innerHTML='';
  var closeBtn=document.createElement('button');
  closeBtn.className='order-detail-close';
  closeBtn.innerHTML='✕';
  closeBtn.onclick=function(){_closeOrderDetailGuarded();};
  modal.appendChild(closeBtn);
  modal.appendChild(_buildOrderCard(o));
  document.getElementById('orderDetailOverlay').classList.add('open');
}
function closeOrderDetail(){
  _closeOrderDetailUI();
  renderHistory();
}
// 팝업 UI만 닫기(가드 없이) — 취소/삭제 확정 후 사용
function _closeOrderDetailUI(){
  _detailOrderId=null;
  document.getElementById('orderDetailOverlay').classList.remove('open');
  document.getElementById('orderDetailModal').innerHTML='';
}
function _updateHistTotal(id){
  var ords=JSON.parse(localStorage.getItem('orders')||'[]');
  var o=ords.find(function(o){return o.id===id;});
  if(!o)return;
  var isPickup=(o.memo||'').startsWith('매장픽업');
  var itemsSum=o.items.reduce(function(s,i){return s+i.price*i.qty;},0);
  // 2만원 미만 + 픽업 아님 → 매장픽업 강제
  if(itemsSum<20&&!isPickup){
    o.memo='매장픽업';
    localStorage.setItem('orders',JSON.stringify(ords));
    isPickup=true;
    var memoWrap=document.getElementById('histmemo-'+id);
    if(memoWrap)memoWrap.innerHTML=_histMemoHtml(id,'매장픽업');
    showToast('⚠️ 2만원 미만 — 매장픽업으로 자동 변경됐어요.');
  }
  var df=(!isPickup&&itemsSum>=20)?1:0;
  var total=itemsSum+df;
  o.total=total;
  o.deliveryFee=df;
  localStorage.setItem('orders',JSON.stringify(ords));
  var cardEl=document.getElementById('histcard-'+id);
  if(cardEl)cardEl.dataset.deliveryFee=df;
  var feeEl=document.getElementById('histfee-'+id);
  if(feeEl)feeEl.style.display=df?'flex':'none';
  var tEl=document.getElementById('histtotal-'+id);
  if(tEl)tEl.innerHTML='<span>합계</span><span class="hist-total-val">'+comma(total)+'천원</span>';
}
function histEditQty(orderId,itemName,d){
  var orders=JSON.parse(localStorage.getItem('orders')||'[]');
  var o=orders.find(function(o){return o.id===orderId;});
  if(!o)return;
  var item=o.items.find(function(i){return i.name===itemName;});
  if(!item)return;
  item.qty=Math.max(1,item.qty+d);
  var key=itemName.replace(/\s/g,'_');
  var qEl=document.getElementById('histqty-'+orderId+'-'+key);
  var pEl=document.getElementById('histprice-'+orderId+'-'+key);
  if(qEl)qEl.textContent=item.qty;
  if(pEl)pEl.textContent=comma(item.price*item.qty)+'천원';
  localStorage.setItem('orders',JSON.stringify(orders));
  _histDirty[orderId]=true;   // 화면 갱신보다 먼저 — '저장'을 눌러야 서버에 반영된다
  _updateHistTotal(orderId);
}
var _detailOrderId=null;
// 수량/삭제 편집은 화면에서만 반영하고, '저장'을 눌러야 서버 DB에 들어간다.
// 예전에는 누르는 즉시 자동 저장했는데, 그러면 수량을 한 번 누를 때마다
// 업주에게 주문변경 문자가 나가버린다.
var _histDirty={};
var _saveInFlight={};
function _doSaveOrderItems(id,cb){
  if(_saveInFlight[id])return;
  var orders=JSON.parse(localStorage.getItem('orders')||'[]');
  var o=orders.find(function(o){return o.id===id;});
  if(!o){if(cb)cb(false);return;}
  _saveInFlight[id]=true;
  fetch(API_URL+'/api/orders/'+encodeURIComponent(id)+'/items',{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items:o.items,total:o.total,memo:o.memo||''})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    _saveInFlight[id]=false;
    var ok=!!(d&&d.success!==false);
    if(ok)delete _histDirty[id];
    if(cb)cb(ok,d);
  })
  .catch(function(){_saveInFlight[id]=false;if(cb)cb(false);});
}
// '저장' 버튼 — 이때만 서버에 반영되고 업주에게 변경 문자가 나간다.
// 문자가 남발되지 않도록 한 번 더 확인받고, 확인한 뒤에는 저장하고 창을 닫는다.
function histSaveItemsNow(id){
  if(!_histDirty[id]){showToast('변경한 내용이 없어요.');return;}
  var ords=JSON.parse(localStorage.getItem('orders')||'[]');
  var ord=ords.find(function(o){return o.id===id;});
  var sum=ord?('\n\n합계 '+comma(ord.total||0)+'천원'):'';
  showConfirm('변경된 내역으로 재주문하여도 괜찮아요?'+sum,function(){
    _doSaveOrderItems(id,function(ok,d){
      if(ok){showToast('저장되었습니다.');closeOrderDetail();}
      else if(d&&d.soldOut&&d.soldOut.length)showToast('재고가 부족해요: '+d.soldOut.map(function(s){return s.name;}).join(', '));
      else showToast('⚠️ 저장 실패 — 다시 시도해주세요.');
    });
  },'네');
  // '아니오'를 누르면 아무 동작 없이 확인창만 닫히고 주문 팝업으로 돌아간다
}
// 저장하지 않고 닫을 때 — 서버 값으로 되돌려 화면과 실제 주문이 어긋나지 않게 한다
function _revertHistOrder(id,cb){
  fetch(API_URL+'/api/orders?deviceId='+encodeURIComponent(getDeviceId()),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      var go=(d.orders||[]).find(function(x){return x.id===id;});
      if(go){
        var all=JSON.parse(localStorage.getItem('orders')||'[]');
        var i=all.findIndex(function(x){return x.id===id;});
        if(i>=0){all[i].items=go.items;all[i].total=go.total;all[i].memo=go.memo;localStorage.setItem('orders',JSON.stringify(all));}
      }
      delete _histDirty[id];
      if(cb)cb();
    })
    .catch(function(){delete _histDirty[id];if(cb)cb();});
}
// 닫기 가드 — 저장 안 한 변경이 있으면 물어본다
function _closeOrderDetailGuarded(){
  var id=_detailOrderId;
  if(!id||!_histDirty[id]){closeOrderDetail();return;}
  showConfirm('변경한 내용을 저장할까요?\n\n저장하지 않으면 원래 주문으로 되돌아갑니다.',
    function(){   // 저장하고 닫기
      _doSaveOrderItems(id,function(ok){
        if(ok){showToast('저장되었습니다.');closeOrderDetail();}
        else showToast('⚠️ 저장 실패 — 다시 시도해주세요.');
      });
    },'저장하고 닫기',
    function(){   // 되돌리고 닫기
      _revertHistOrder(id,function(){showToast('변경을 되돌렸어요.');closeOrderDetail();});
    },'되돌리고 닫기');
}
function histDelItem(orderId,itemName){
  var orders=JSON.parse(localStorage.getItem('orders')||'[]');
  var o=orders.find(function(o){return o.id===orderId;});
  if(!o)return;
  if(o.items.length<=1){showToast('최소 1개 항목이 필요합니다.');return;}
  o.items=o.items.filter(function(i){return i.name!==itemName;});
  var key=itemName.replace(/\s/g,'_');
  var row=document.getElementById('histrow-'+orderId+'-'+key);
  if(row)row.remove();
  localStorage.setItem('orders',JSON.stringify(orders));
  _histDirty[orderId]=true;   // 화면 갱신보다 먼저 — '저장'을 눌러야 서버에 반영된다
  _updateHistTotal(orderId);
}
/* ── 주문 내역 배송방법/추가요청 편집 ── */
function _histMemoHtml(id,text){
  if(!text) return '<button class="hist-req-add-btn" onclick="histEditMemo(\''+id+'\')">📝 배송 방법 선택</button>';
  var delivery=(text||'').split(' / ')[0].trim();   // 레거시 인라인 노트 제거, 배송방법만
  var safeD=delivery.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="hist-req-row memo-row"><span>🚚 '+safeD+'</span>'
    +'<button class="hist-req-edit-btn" onclick="histEditMemo(\''+id+'\')" title="수정">✏️ 수정</button></div>';
}
function _histExtraHtml(id,text){
  if(!text) return '<button class="hist-req-add-btn" onclick="histEditExtra(\''+id+'\')">✏️ 추가 요청 입력</button>';
  var safe=(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  return '<div class="hist-extra-card-section">'

  if(!ord)return;

    showToast('⚠️ 2만원 미만은 매장픽업만 가능해요.');return;

  var before=(ord.memo||'').split(' / ')[0].trim();

/* ── SSE 실시간 동기화 ── */
var _sse=null;
var _sseReconnTimer=null;
var _sseHistTimer=null;

function _debouncedRenderHistory(){
  if(_sseHistTimer)clearTimeout(_sseHistTimer);
  _sseHistTimer=setTimeout(function(){
    var histActive=document.getElementById('page-history')&&
                   document.getElementById('page-history').classList.contains('active');
    if(!histActive)return;
    var ae=document.activeElement;
    var isTyping=ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT');
    if(isTyping){
      ae.addEventListener('blur',function(){renderHistory();},{once:true});
    } else {
      renderHistory();
    }
  },500);
}

function _startSSE(){
  if(_sse){_sse.close();_sse=null;}
  if(_sseReconnTimer){clearTimeout(_sseReconnTimer);_sseReconnTimer=null;}
  _sse=new EventSource(API_URL+'/api/events');
  _sse.onmessage=function(e){
    try{
      _debouncedRenderHistory();
    }catch(ex){}
  };
  _sse.onerror=function(){
    _sse.close();_sse=null;
    _sseReconnTimer=setTimeout(_startSSE,5000);
  };
}

var _reserveEventData=null;
function loadReserveEvent(){
  return fetch(API_URL+'/api/settings',{cache:'no-store'})
  .then(function(r){return r.json();})
  .then(function(d){
    var ev=(d&&d.success&&d.data&&d.data.reserveEvent)||null;
    _reserveEventData=(ev&&ev.name&&ev.deadline&&ev.deadline>=toISO(new Date()))?ev:null;
    _renderReserveEventCard();
  })
  .catch(function(){});
}
function _renderReserveEventCard(){
  var reserveEl=document.getElementById('reserveEventCard');
  var listEl=document.getElementById('menuListEventCard');
  if(!_reserveEventData){
    if(reserveEl)reserveEl.innerHTML='';
    if(listEl)listEl.innerHTML='';
    return;
  }
  var ev=_reserveEventData;
  var safeDesc=(ev.desc||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // 배지+설명+기한을 한 줄로 요약 표시 — 메뉴 페이지·예약주문 페이지 공통, 클릭 시 상세 팝업(예약 팝업) 바로 표시
  var compactBody='<div style="display:flex;align-items:center;gap:8px;">'
    +'<span class="reserve-event-badge" style="margin-bottom:0;flex-shrink:0;">🎉 예약 이벤트</span>'
    +'<span class="reserve-event-name" style="margin-bottom:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;">'+safeDesc+'</span>'
    +'<span class="reserve-event-deadline" style="flex-shrink:0;">~'+fmtDate(ev.deadline)+' 까지</span>'
    +'</div>';
  var cardHtml='<div class="reserve-event-card" style="margin:10px 12px;padding:12px 16px;" onclick="_selectReserveEvent()">'+compactBody+'</div>';
  if(reserveEl)reserveEl.innerHTML=cardHtml;
  if(listEl)listEl.innerHTML=cardHtml;
}
function fmtDate(iso){
  var p=(iso||'').split('-');
  return p.length>=3?(p[1]+'/'+p[2]):(iso||'');
}
// 갤러리 등 외부 페이지에서 특정 메뉴로 바로 예약 신청 팝업을 열 때 사용 — "예약 주문 신청하기"와 동일 기능 재사용
function _selectReserveItemByName(name){
  _selectReserveItemsByNames([name]);
}
// 여러 메뉴를 한 번에 예약 신청 팝업에 담을 때 사용(갤러리 추천메뉴 체크선택 → 예약주문 등)
function _selectReserveItemsByNames(names){
  var added=false;
  (names||[]).forEach(function(name){
    var m=_reserveAllMenus.find(function(x){return x.name===name;});
    if(!m)return;
    _reserveSel[m.menuId]={id:m.menuId,name:m.name,cat:m.cat,price:Number(m.price)||0,qty:1};
    added=true;
  });
  if(!added)return;
  _renderReserveList();
  _renderReserveBar();
  openReservePopup();
}
function _selectReserveEvent(){
  if(!_reserveEventData)return;
  _reserveSel['EVENT']={id:'EVENT',name:_reserveEventData.name,cat:'이벤트',price:Number(_reserveEventData.price)||0,qty:1};
  _renderReserveList();
  _renderReserveBar();
  openReservePopup();
}
function loadReserveMenus(cb){
  loadReserveEvent();
  if(_reserveLoaded){if(cb)cb();return;}
  document.getElementById('reserveMenuList').innerHTML=
    '<div style="text-align:center;padding:40px;color:#aaa;font-size:13px;">마스터 메뉴 불러오는 중...</div>';
  fetch(API_URL+'/api/menu/all',{cache:'no-store'})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.success&&Array.isArray(d.menus)){
      _reserveAllMenus=d.menus;
      _reserveLoaded=true;
      renderReservePage();
      if(cb)cb();
    } else {
      document.getElementById('reserveMenuList').innerHTML=
        '<div style="text-align:center;padding:40px;color:#e05;font-size:13px;">메뉴를 불러오지 못했어요.</div>';
    }
  })
  .catch(function(){
    document.getElementById('reserveMenuList').innerHTML=
      '<div style="text-align:center;padding:40px;color:#e05;font-size:13px;">네트워크 오류가 발생했어요.</div>';
  });
}
function renderReservePage(){
  _renderReserveCatTabs();
  _renderReserveList();
  _renderReserveBar();
}
function _reserveCats(){
  var cats=['전체'];
  var seen={};
  _reserveAllMenus.forEach(function(m){if(m.cat&&!seen[m.cat]){seen[m.cat]=1;cats.push(m.cat);}});
  return cats;
}
function _renderReserveCatTabs(){
  var wrap=document.getElementById('reserveCatTabs');
  if(!wrap)return;
  var cats=_reserveCats();
  wrap.innerHTML=cats.map(function(c){
    var lbl=c==='전체'?'전체':((CAT_EMOJI[c]||'')+' '+c);
    return '<button class="reserve-cat-tab'+(c===_reserveCat?' active':'')+'" onclick="_setReserveCat(\''+c.replace(/'/g,"\\'")+'\')">'
      +lbl+'</button>';
  }).join('');
}
function _setReserveCat(cat){
  _reserveCat=cat;
  _reservePage=0;
  _renderReserveCatTabs();
  _renderReserveList();
}
function _reserveFiltered(){
  var list=_reserveAllMenus;
  if(_reserveSearchText){
    var kw=_reserveSearchText.toLowerCase();
    list=list.filter(function(m){return m.name.toLowerCase().indexOf(kw)>=0;});
  }
  if(_reserveCat!=='전체')list=list.filter(function(m){return m.cat===_reserveCat;});
  return list;
}
function _setReserveSearch(v){
  _reserveSearchText=v;
  _reservePage=0;
  _renderReserveList();
}
function _renderReserveList(){
  var wrap=document.getElementById('reserveMenuList');
  if(!wrap)return;
  var list=_reserveFiltered();
  var total=list.length;
  var pages=Math.max(1,Math.ceil(total/_RESERVE_PAGE));
  if(_reservePage>=pages)_reservePage=pages-1;
  _reservePageItems=list.slice(_reservePage*_RESERVE_PAGE,(_reservePage+1)*_RESERVE_PAGE);
  var html='';
  _reservePageItems.forEach(function(m,i){
    var sel=!!_reserveSel[m.menuId];
    html+='<div class="reserve-menu-row'+(sel?' selected':'')+'" onclick="_toggleReserveByIdx('+i+')">'
      +'<div class="reserve-check">'+( sel?'✓':'' )+'</div>'
      +'<div class="reserve-menu-emoji">'+getMenuEmoji(m.name,m.cat)+'</div>'
      +'<div class="reserve-menu-info">'
        +'<div class="reserve-menu-name">'+m.name+'</div>'
        +'<div class="reserve-menu-cat-lbl">'+(CAT_EMOJI[m.cat]||'')+' '+m.cat+'</div>'
      +'</div>'
      +'<div class="reserve-menu-price">'+comma(m.price)+'천원</div>'
      +'</div>';
  });
  if(!_reservePageItems.length){
    html='<div style="text-align:center;padding:40px;color:#aaa;font-size:13px;">메뉴가 없어요.</div>';
  }
  html+='<div class="reserve-pager">'
    +'<button onclick="_reservePageGo(-1)"'+(_reservePage===0?' disabled':'')+'>이전</button>'
    +'<span>'+(_reservePage+1)+' / '+pages+'</span>'
    +'<button onclick="_reservePageGo(1)"'+(_reservePage>=pages-1?' disabled':'')+'>다음</button>'
    +'</div>';
  wrap.innerHTML=html;
}
function _reservePageGo(d){
  _reservePage+=d;
  _renderReserveList();
}
function _toggleReserveByIdx(i){
  var m=_reservePageItems[i];
  if(!m)return;
  if(_reserveSel[m.menuId]){delete _reserveSel[m.menuId];}
  else{_reserveSel[m.menuId]={id:m.menuId,name:m.name,cat:m.cat,price:m.price,qty:1};}
  _renderReserveList();
  _renderReserveBar();
}
function _renderReserveBar(){
  var old=document.getElementById('reserveSubmitBar');
  if(old)old.remove();
  var page=document.getElementById('page-reserve');
  if(!page||!page.classList.contains('active'))return;
  var cnt=Object.keys(_reserveSel).length;
  var bar=document.createElement('div');
  bar.className='reserve-submit-bar';
  bar.id='reserveSubmitBar';
  bar.innerHTML='<div class="reserve-submit-badge">'+cnt+'</div>'

  document.body.appendChild(bar);   // 뷰포트 기준 진짜 플로팅 — 부모 컨테이너 영향 배제
}
function openReservePopup(){
  if(!Object.keys(_reserveSel).length){showToast('메뉴를 선택해주세요.');return;}
  _reserveDateMin=toISO(new Date(new Date().getTime()+24*60*60*1000));
  _reserveDateMax=toISO(new Date(new Date().getTime()+7*24*60*60*1000));
  var hintEl=document.getElementById('reserveDateHint');
  // 예약 이벤트가 선택되어 있으면 예약일자는 이벤트 기한일 이후 1주일까지만 허용
  if(_reserveSel['EVENT']&&_reserveEventData&&_reserveEventData.deadline){
    _reserveDateMin=_reserveEventData.deadline;
    _reserveDateMax=toISO(new Date(new Date(_reserveEventData.deadline+'T00:00:00').getTime()+7*24*60*60*1000));
    if(hintEl)hintEl.textContent='('+fmtDate(_reserveDateMin)+'부터 1주일 이내)';
  }else if(hintEl){
    hintEl.textContent='(오늘로부터 1~7일)';
  }
  var rdi=document.getElementById('reserveDateInput');
  if(rdi){rdi.min=_reserveDateMin;rdi.max=_reserveDateMax;if(!rdi.value||rdi.value<_reserveDateMin)rdi.value=_reserveDateMin;}
  _renderReserveModalItems();
  document.getElementById('reserveOverlay').classList.add('open');
  // 고객 정보 자동완성 (비어있을 때만)
  var nEl=document.getElementById('reserveName');
  var pEl=document.getElementById('reservePhone');
  if(nEl&&!nEl.value&&pEl&&!pEl.value){
    var did=getDeviceId();
    fetch(API_URL+'/api/customers-master?device_id='+encodeURIComponent(did))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.success&&d.items&&d.items.length){
          var m=d.items[0];
          if(m.name) nEl.value=m.name;
          if(m.phone) pEl.value=formatPhone(m.phone);
          var aEl=document.getElementById('reserveAddr');
          if(aEl&&m.addr1&&!aEl.value) aEl.value=m.addr1;
          _toggleReserveAddrListBtn();
        }
      }).catch(function(){});
  }
}
function closeReservePopup(){
  document.getElementById('reserveOverlay').classList.remove('open');
}
function _renderReserveModalItems(){
  var items=Object.values(_reserveSel);
  var html='';
  items.forEach(function(it){
    html+='<div class="reserve-modal-item">'
      +'<span class="reserve-item-name">'+it.name+'</span>'
      +'<div class="reserve-qty-ctrl">'
        +'<button onclick="_reserveQty(\''+it.id+'\', -1)">−</button>'
        +'<span id="rqty-'+it.id+'">'+it.qty+'</span>'
        +'<button onclick="_reserveQty(\''+it.id+'\', 1)">+</button>'
      +'</div>'
      +'<span class="reserve-item-price" id="rprice-'+it.id+'">'+comma(it.price*it.qty)+'천원</span>'
      +'</div>';
  });
  document.getElementById('reserveModalItems').innerHTML=html;
  _updateReserveTotal();

function _reserveQty(id,delta){
  if(!_reserveSel[id])return;
  var q=Math.max(1,Math.min(99,_reserveSel[id].qty+delta));
  _reserveSel[id].qty=q;
  var qs=document.getElementById('rqty-'+id);
  if(qs)qs.textContent=q;
  var ps=document.getElementById('rprice-'+id);
  if(ps)ps.textContent=comma(_reserveSel[id].price*q)+'천원';
  _updateReserveTotal();
}
function _updateReserveTotal(){
  var itemsTotal=Object.values(_reserveSel).reduce(function(s,it){return s+it.price*it.qty;},0);
  var memo=(document.getElementById('reserveMemo')||{}).value||'';
  var isPickup=memo==='매장픽업';
  var hasDelivery=!isPickup&&!!memo;
  var deliveryFee=(hasDelivery&&itemsTotal>=20)?1:0;
  var el=document.getElementById('reserveModalTotal');
  if(!el)return;
  el.innerHTML='<span>합계</span><span style="color:var(--teal)">'+comma(itemsTotal+deliveryFee)+'천원</span>';
  var noteEl=document.getElementById('reserveFeeNote');
  if(noteEl){
    if(hasDelivery&&itemsTotal>0&&itemsTotal<20){
      noteEl.innerHTML='<span style="color:#e53935;">⚠️ 2만원 미만은 매장 픽업만 가능해요</span>';
    } else if(deliveryFee){
      noteEl.innerHTML='<span style="color:#888;">배송비 1천원 포함</span>';
    } else {
      noteEl.innerHTML='';
    }
  }
}
function submitReserveOrder(){
  var name=(document.getElementById('reserveName').value||'').trim();
  var phone=(document.getElementById('reservePhone').value||'').replace(/[^0-9]/g,'');
  var reserveDate=(document.getElementById('reserveDateInput').value||'').trim();
  var addr=(document.getElementById('reserveAddr').value||'').trim();
  var memo=(document.getElementById('reserveMemo').value||'').trim();
  var req=(document.getElementById('reserveRequest').value||'').trim();
  if(!name){showToast('이름을 입력해주세요.');return;}
  if(!phone){showToast('전화번호를 입력해주세요.');return;}
  if(!reserveDate){showToast('예약 날짜를 선택해주세요.');return;}
  if(reserveDate<_reserveDateMin||reserveDate>_reserveDateMax){
    var isEvt=!!(_reserveSel['EVENT']&&_reserveEventData&&_reserveEventData.deadline);
    showToast(isEvt?('예약 날짜는 '+fmtDate(_reserveDateMin)+'부터 1주일 이내로 선택해주세요.'):'예약 날짜는 내일부터 7일 이내로 선택해주세요.');
    return;
  }
  if(!memo){showToast('배송 방법을 선택해주세요.');return;}
  var items=Object.values(_reserveSel).map(function(it){
    return{menuId:it.id,name:it.name,cat:it.cat,qty:it.qty,price:it.price};
  });
  if(!items.length){showToast('메뉴를 선택해주세요.');return;}
  var itemsTotal=items.reduce(function(s,it){return s+it.price*it.qty;},0);
  var isPickup=memo==='매장픽업';
  if(!isPickup&&!addr){showToast('배송 주소를 입력해주세요.');return;}
  if(!isPickup&&itemsTotal<20){showToast('2만원 미만 주문은 매장 픽업만 가능해요.');return;}
  var deliveryFee=(!isPickup&&itemsTotal>=20)?1:0;
  var total=itemsTotal+deliveryFee;
  var order={
    id:'RSV'+Date.now(),
    date:menuDate,
    time:new Date().toTimeString().slice(0,8),
    name:name,phone:phone,addr:addr,memo:memo,
    additionalRequest:req||'',
    items:items,total:total,deliveryFee:deliveryFee,
    deviceId:getDeviceId(),
    status:'pending',
    reserveDate:reserveDate
  };
  var btn=document.querySelector('.reserve-confirm-btn');
  if(btn){btn.disabled=true;btn.textContent='저장 중...';}
  fetch(API_URL+'/api/orders',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({data:order})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.success){
      closeReservePopup();
      _reserveSel={};
      _renderReserveList();
      _renderReserveBar();
      showToast('예약 주문이 접수되었어요 ✅');
    } else {
      showToast('저장 실패: '+(d.error||'오류'));
    }
  })
  .catch(function(){showToast('저장 중 오류가 발생했어요.');})
  .finally(function(){
    if(btn){btn.disabled=false;btn.textContent='저장';}
  });
}

window.onload=function(){
  // 관리자가 바꾼 카테고리 색을 반영. 늦게 도착하면 이미 그려진 화면만 다시 칠한다.
  loadCatColorsFromServer(function(changed){
    if(changed){renderCatTabs();renderMenuGrid();}
  });
  // 이미지 갤러리 등 외부 페이지에서 특정 메뉴 상세를 바로 열도록 딥링크 지원
  var _urlParams=new URLSearchParams(window.location.search);
  var _openMenuName=_urlParams.get('openMenu');
  var _gotoPage=_urlParams.get('goto');
  var _openReserveName=_urlParams.get('openReserve');
  var _openReserveEvent=_urlParams.get('openReserveEvent');
  var _openReserveMultiNames=[];
  try{
    var _openReserveMultiRaw=_urlParams.get('openReserveMulti');
    if(_openReserveMultiRaw)_openReserveMultiNames=JSON.parse(_openReserveMultiRaw)||[];
  }catch(e){_openReserveMultiNames=[];}
  var _openCartMultiNames=[];
  try{
    var _openCartMultiRaw=_urlParams.get('openCartMulti');
    if(_openCartMultiRaw)_openCartMultiNames=JSON.parse(_openCartMultiRaw)||[];
  }catch(e){_openCartMultiNames=[];}
  var _refDecoded=document.referrer;
  try{_refDecoded=decodeURIComponent(_refDecoded);}catch(e){}
  if(/온반_메뉴_이미지갤러리\.html/.test(_refDecoded)){
    var _logoEl=document.getElementById('topBarLogo');
    _logoEl.classList.add('from-gallery');
    _logoEl.title='이전 페이지로 돌아가기';
    _logoEl.onclick=function(){window.location.href='온반_메뉴_이미지갤러리.html';};
  }
  loadMenus(false,function(){
    if(_openMenuName){
      var m=allMenus.find(function(x){return x.name===_openMenuName;});
      if(m){
        // 기존 메뉴 페이지의 '장바구니 담기'와 동일하게 즉시 담고 주문 처리로 바로 진행
        var ex=cart.find(function(c){return c.name===m.name;});
        if(ex){ex.qty++;}
        else{cart.push({menuId:(m.menuId!=null?m.menuId:null),name:m.name,cat:m.cat||'',price:m.price,qty:1,imgUrl:m.imgUrl||null,child:m.child,checked:true});}
        updateCartCount();
        goPage('cart');
      }
    } else if(_openCartMultiNames.length){
      // 갤러리 '오늘의 메뉴'/AI추천 결과에서 체크박스로 여러 항목 선택 후 '장바구니로' → 전부 담아 장바구니 진입
      _openCartMultiNames.forEach(function(name){
        var mm=allMenus.find(function(x){return x.name===name;});
        if(!mm)return;
        var ex=cart.find(function(c){return c.name===mm.name;});
        if(ex){ex.qty++;}
        else{cart.push({menuId:(mm.menuId!=null?mm.menuId:null),name:mm.name,cat:mm.cat||'',price:mm.price,qty:1,imgUrl:mm.imgUrl||null,child:mm.child,checked:true});}
      });
      updateCartCount();
      goPage('cart');
    }
  });
  if(_openReserveEvent){
    // 갤러리 예약 이벤트 카드 클릭 → 예약주문 페이지 진입과 동시에 이벤트 신청 팝업 자동 오픈
    goPage('reserve',function(){loadReserveEvent().then(function(){_selectReserveEvent();});});
  }else if(_openReserveName){
    // 갤러리 '예약주문' 모드에서 항목 클릭 → 예약주문 페이지 진입과 동시에 '예약 주문 신청하기' 팝업까지 자동 오픈
    goPage('reserve',function(){_selectReserveItemByName(_openReserveName);});
  }else if(_openReserveMultiNames.length){
    // 갤러리 추천메뉴에서 체크박스로 여러 항목 선택 후 예약주문 → 전부 담은 채로 팝업 자동 오픈
    goPage('reserve',function(){_selectReserveItemsByNames(_openReserveMultiNames);});
  }else if(_gotoPage){
    goPage(_gotoPage);   // 예) 갤러리 '예약주문' 버튼 → 예약주문 페이지로 바로 이동(기존 기능 그대로 재사용)
  }
  loadReserveEvent();
  _startMenuAutoRefresh();
  _startSSE();
};
// 뒤로가기로 브라우저 캐시(bfcache)에서 페이지가 그대로 복원되면 onload가 다시 실행되지 않아
// 이전에 눌러둔 카테고리 필터가 "기본값"처럼 남아있게 됨 → 전체로 되돌리고 다시 그림
window.addEventListener('pageshow',function(e){
  if(e.persisted&&filterCat!=='전체'){
    filterCat='전체';
    renderCatTabs();
    renderMenuGrid();
  }
});
</script>

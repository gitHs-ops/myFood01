<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>오늘의 반찬 주문</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#086266; --teal2:#0a7a7f; --mint:#9adcda;
  --bg:#0c1414; --white:#fff; /* bg는 fallback용 */
  --text:#1a1a1a; --sub:#666; --light:#aaa;
  --red:#e05; --amber:#E9A826;
  --shadow:0 2px 16px rgba(8,98,102,.10);
  --radius:14px;
}
html{scroll-behavior:smooth;}
body{font-family:"Noto Sans KR",sans-serif;background:linear-gradient(to bottom,#000000 0%,#000000 3%,#0d2525 15%,#1a3838 100%) fixed;color:var(--text);min-height:100vh;padding-bottom:80px;}

/* ── 헤더 ── */
.top-bar{
  background:#000;
  padding:12px 16px 12px;
  display:flex;flex-direction:column;gap:10px;
  position:sticky;top:0;z-index:90;
  box-shadow:0 2px 12px rgba(8,98,102,.25);
}
.top-bar h1{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px;}
.top-bar-logo{height:40px;display:block;mix-blend-mode:lighten;flex-shrink:0;}
.top-bar-logo.from-gallery{cursor:pointer;}
.top-bar-sub{font-size:13px;color:rgba(255,255,255,.7);font-weight:400;letter-spacing:-.2px;}
.cart-btn{display:none;}/* 구 cart-btn 숨김 — top-btn으로 대체 */
.cart-count{
  background:var(--red);color:#fff;font-size:10px;font-weight:900;
  width:17px;height:17px;border-radius:50%;
  align-items:center;justify-content:center;
  display:none;flex-shrink:0;
}
.cart-count.on{display:flex;}

/* ── 날짜 배너 ── */
.date-banner{
  background:#ffffff;
  padding:10px 20px;font-size:13px;color:#1a1a1a;font-weight:500;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.date-refresh-countdown{font-size:12px;font-weight:700;color:#fff;background:rgba(8,98,102,.6);border-radius:20px;padding:3px 10px;white-space:nowrap;min-width:46px;text-align:center;flex-shrink:0;}
.date-gallery-btn{font-size:12px;font-weight:700;color:var(--teal);background:#e6f4f3;border-radius:20px;padding:3px 10px;white-space:nowrap;text-decoration:none;flex-shrink:0;}

/* ── 카테고리 탭 ── */
.cat-tabs{padding:10px 16px 8px;}
.cat-tabs-row{display:flex;gap:8px;flex-wrap:wrap;}
.cat-tabs-row.row2{justify-content:center;margin-top:6px;}
.cat-tab{
  flex-shrink:0;padding:6px 14px;border-radius:999px;
  font-size:13px;font-weight:500;border:1.5px solid #d6efee;
  background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap;
  transition:all .15s;
}
.cat-tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}

/* ── 메뉴 그리드 ── */
.menu-grid{
  display:flex;flex-direction:column;gap:8px;
  padding:0 14px;
}
.menu-card{
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);
  cursor:default;
  border:1.5px solid transparent;
  display:flex;align-items:center;
  padding:13px 14px 13px 12px;gap:8px;
}
.menu-card.child-ok{border-left:4px solid #FEE500;}
.menu-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.menu-thumb{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#e8f5f4,#c8ebe9);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;}
.menu-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.menu-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.menu-name-wrap{
  display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;
}
.menu-name{
  font-size:14px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.menu-child-tag{
  font-size:11px;background:#FEE500;color:#3A1D1D;
  padding:1px 6px;border-radius:999px;font-weight:700;flex-shrink:0;
}
.menu-price{font-size:14px;font-weight:900;color:var(--teal);flex-shrink:0;white-space:nowrap;}
.menu-arrow{font-size:16px;color:#ccc;flex-shrink:0;}
.menu-card.soldout{opacity:.55;cursor:default;}
/* ── 체크박스 ── */
.menu-chk{
  width:26px;height:26px;border-radius:6px;border:2px solid #ccc;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .15s;background:#fff;cursor:pointer;touch-action:manipulation;
}
.menu-chk.checked{background:var(--teal);border-color:var(--teal);}
.menu-chk.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:900;}
.menu-card.selected{border-color:var(--teal);background:#f0faf9;}
/* ── 플로팅 장바구니 버튼 ── */
.float-cart-wrap{
  position:fixed;bottom:28px;left:16px;right:16px;
  z-index:300;display:none;
  text-align:center;pointer-events:none;
  animation:floatUp .2s ease;
}
@keyframes floatUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.float-cart-btn{
  background:var(--teal);color:#fff;border:none;border-radius:999px;
  padding:14px 32px;font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 6px 24px rgba(8,98,102,.45);white-space:nowrap;
  display:inline-flex;align-items:center;gap:8px;pointer-events:auto;
  max-width:100%;
}
.menu-soldout-tag{
  font-size:11px;background:#eee;color:#999;
  padding:2px 7px;border-radius:999px;font-weight:700;flex-shrink:0;
}
.menu-stock-tag{
  font-size:11px;background:#e8f5f4;color:#086266;
  padding:2px 7px;border-radius:999px;font-weight:700;flex-shrink:0;white-space:nowrap;
}
.menu-stock-tag.low{background:#fff0f0;color:#e53935;}
/* ── 페이지 전환 ── */
.page{display:none;}
.page.active{display:block;}

/* ── 메뉴 상세 팝업 (오버레이) ── */
.menu-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayFadeIn .2s ease;}
@keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
.menu-modal{position:relative;background:#fff;border-radius:22px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;animation:modalSlideUp .25s ease;}
@keyframes modalSlideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.menu-modal-img{width:calc(100% - 28px);height:200px;background:linear-gradient(135deg,#e8f5f4,#c8ebe9);display:flex;align-items:center;justify-content:center;font-size:68px;border-radius:16px;overflow:hidden;flex-shrink:0;margin:14px 14px 0;border:3px solid #e0e0e0;box-sizing:border-box;}
.menu-modal-img img{width:100%;height:100%;object-fit:cover;}
.menu-modal-close{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.28);border:none;border-radius:50%;width:30px;height:30px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:1;}
.menu-modal-body{padding:12px 16px 16px;}
.menu-modal-name{font-size:17px;font-weight:900;color:#1a1a1a;margin-bottom:6px;}
.menu-modal-price{font-size:20px;font-weight:900;color:var(--teal);margin-bottom:4px;}
.menu-modal-price span{font-size:12px;font-weight:400;color:var(--sub);}
.menu-modal-desc{font-size:12px;line-height:1.6;color:#444;margin-top:10px;padding-top:10px;border-top:1px solid #eee;white-space:pre-wrap;word-break:break-word;}
.menu-modal-img{position:relative;}
.tmp-img-badge{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:13px;font-weight:900;padding:5px 18px;border-radius:20px;letter-spacing:.5px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;}
.menu-modal-actions{padding:10px 14px 18px;display:flex;gap:10px;align-items:center;}
.menu-modal-cart-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;}
.menu-modal-cart-btn:active{opacity:.8;}
.menu-modal-cart-btn.sold-out{background:#ccc;cursor:not-allowed;}
/* ── 뒤로 버튼 ── */
.back-bar{
  display:flex;align-items:center;gap:8px;
  padding:14px 16px;cursor:pointer;color:rgba(255,255,255,.85);
  font-size:14px;font-weight:700;
}
.back-bar svg{width:20px;height:20px;fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.5;}
.back-bar:hover{color:#fff;}
.back-bar:hover svg{stroke:#fff;}

/* ── 장바구니 ── */
.cart-list{padding:0 14px;}
.cart-item{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.cart-check{width:20px;height:20px;accent-color:var(--teal);flex-shrink:0;cursor:pointer;}
.cart-thumb{
  width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:linear-gradient(135deg,#e8f5f4,#c8ebe9);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.cart-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.cart-info{flex:1;min-width:0;}
.cart-iname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-iprice{font-size:13px;color:var(--teal);font-weight:700;margin-top:2px;}
.cart-qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid #d6efee;border-radius:8px;overflow:hidden;}
.cart-qty-ctrl button{width:28px;height:28px;border:none;background:#f4fafa;font-size:14px;font-weight:700;color:var(--teal);cursor:pointer;}
.cart-qty-ctrl span{width:32px;text-align:center;font-size:13px;font-weight:700;}
.cart-del{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:4px;flex-shrink:0;}
.cart-del:hover{color:var(--red);}

.cart-summary{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow);margin:10px 14px;padding:16px;
}
.cart-summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.cart-summary-row:last-child{margin-bottom:0;}
.sum-label{font-size:13px;color:var(--sub);}
.sum-value{font-size:13px;font-weight:700;}
.sum-total{font-size:18px;font-weight:900;color:var(--teal);}
.sum-delivery-info{font-size:12px;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px dashed #e0e0e0;text-align:center;}
.sum-delivery-info.ok{color:#086266;}
.sum-delivery-info.warn{color:#e08600;}
.cart-actions{padding:0 14px;display:flex;gap:10px;margin-top:14px;}
.btn-select-all{
  padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;
  border:1.5px solid #d6efee;background:#fff;color:var(--sub);cursor:pointer;
}
.btn-cart-order{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;border-radius:12px;font-size:15px;font-weight:700;
  border:none;background:var(--teal);color:#fff;cursor:pointer;
}
.btn-cart-order svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;}
.empty-cart{
  text-align:center;padding:60px 20px;color:var(--light);
}
.empty-cart span{font-size:48px;display:block;margin-bottom:12px;}
.empty-cart p{font-size:14px;}
.cart-del-sel{
  background:none;border:1.5px solid #f5c0c0;color:var(--red);
  border-radius:10px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;
}

/* ── 주문 확인 ── */
.order-section{padding:16px 14px 0;}
.order-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;}
.order-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid #f0faf9;
}
.order-item:last-child{border-bottom:none;}
.order-iname{font-size:14px;font-weight:500;}
.order-iqty{font-size:12px;color:var(--sub);margin-top:2px;}
.order-iprice{font-size:14px;font-weight:700;color:var(--teal);}
.order-total-box{
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  margin:14px;border-radius:var(--radius);padding:18px;
  display:flex;justify-content:space-between;align-items:center;
}
.order-total-label{font-size:14px;color:rgba(255,255,255,.8);}
.order-total-val{font-size:24px;font-weight:900;color:#fff;}
.btn-confirm{
  margin:0 14px;width:calc(100% - 28px);
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:16px;border-radius:12px;font-size:16px;font-weight:900;
  border:none;background:var(--amber);color:#fff;cursor:pointer;
  box-shadow:0 4px 16px rgba(233,168,38,.35);
}
.btn-confirm svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;}

/* ── 결제 페이지 ── */
.payment-wrap{padding:24px 14px;}
.payment-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;}
.payment-icon{font-size:24px;line-height:1;}
.payment-title{font-size:15px;font-weight:900;color:#fff;}
.payment-sub{text-align:center;font-size:11px;color:var(--sub);margin-bottom:18px;}
.bank-card{
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  border-radius:20px;padding:18px;color:#fff;margin-bottom:16px;
  box-shadow:0 6px 24px rgba(8,98,102,.3);
}
.bank-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.bank-label{font-size:11px;opacity:.75;flex-shrink:0;}
.bank-value{font-size:14px;font-weight:900;letter-spacing:.5px;text-align:right;}
.bank-account{font-size:16px;font-weight:900;letter-spacing:.5px;text-align:right;}
.copy-row{display:flex;gap:8px;margin-bottom:14px;}
.btn-copy{
  flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:700;
  border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);
  color:#fff;cursor:pointer;transition:background .15s;
}
.btn-copy:active{background:rgba(255,255,255,.3);}
.amount-box{
  background:#fff;border-radius:var(--radius);padding:14px;
  margin-bottom:16px;box-shadow:var(--shadow);
}
.amount-label{font-size:11px;color:var(--sub);margin-bottom:3px;}
.amount-value{font-size:19px;font-weight:900;color:var(--teal);}
.payment-note{
  background:#fffbea;border:1px solid #FEE500;border-radius:10px;
  padding:12px 14px;font-size:12px;color:#3A1D1D;line-height:1.8;
  margin-bottom:20px;
}
.btn-home{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px;border-radius:12px;font-size:15px;font-weight:700;
  border:none;background:var(--teal);color:#fff;cursor:pointer;
}
.btn-home svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;}

/* ── 공통 ── */
.section-title{font-size:15px;font-weight:700;padding:16px 16px 10px;color:#fff;display:flex;align-items:center;justify-content:space-between;}
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,calc(-50% + 10px));
  background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;
  white-space:nowrap;z-index:99999;
}
.toast.show{opacity:1;transform:translate(-50%,-50%);}
.no-menu{text-align:center;padding:60px 20px;color:var(--light);}
.no-menu span{font-size:48px;display:block;margin-bottom:12px;}
/* ── 주문자 정보 입력 ── */
.orderer-box{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow);margin:14px;padding:18px;
}
.orderer-title{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:14px;}
.orderer-field{margin-bottom:10px;}
.orderer-label{font-size:11px;font-weight:700;color:#888;letter-spacing:.4px;margin-bottom:4px;}
.orderer-input{
  width:100%;padding:12px 14px;
  border:1.5px solid #d6efee;border-radius:10px;
  font-size:15px;font-family:inherit;outline:none;
  margin-bottom:10px;transition:border-color .2s;
}
.orderer-input:focus{border-color:var(--teal);}
.orderer-direct-req{resize:vertical;min-height:72px;font-size:13px;line-height:1.6;color:#333;}
.orderer-req{color:var(--red);font-size:12px;margin-left:2px;}
.cal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:flex-end;justify-content:center;}
.cal-overlay.open{display:flex;}
.addr-wrap{position:relative;margin-bottom:10px;}
.addr-wrap .orderer-input{margin-bottom:0;padding-right:72px;}
.btn-addr-list{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--teal);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.addr-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;max-height:55vh;overflow-y:auto;padding:20px 16px 32px;z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.15);}
.addr-sheet-title{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:14px;}
.addr-item{padding:13px 14px;border-radius:10px;border:1.5px solid #d6efee;margin-bottom:8px;font-size:14px;}
.addr-item-body{cursor:pointer;}
.addr-item-body:active{background:#e8f5f4;border-radius:8px;}
.addr-item-actions{display:flex;gap:6px;margin-top:8px;}
.btn-addr-edit,.btn-addr-del{flex:1;padding:6px 0;font-size:12px;font-weight:700;border:none;border-radius:7px;cursor:pointer;}
.btn-addr-edit{background:#e8f5f4;color:#086266;}
.btn-addr-del{background:#fff0f0;color:#e53935;}
.addr-form{background:#f5f9f9;border-radius:10px;padding:12px;margin-bottom:10px;border:1.5px solid #b2dedd;}
.addr-form input{width:100%;box-sizing:border-box;border:1.5px solid #cce5e4;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;margin-bottom:6px;outline:none;}
.addr-form input:focus{border-color:var(--teal);}
.addr-form input:last-of-type{margin-bottom:8px;}
.addr-form-btns{display:flex;gap:6px;}
.btn-addr-save{flex:2;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer;}
.btn-addr-cancel{flex:1;background:#eee;color:#555;border:none;border-radius:8px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer;}
.no-menu span{font-size:48px;display:block;margin-bottom:12px;}

/* ── 상단 공통 버튼 ── */
.top-btn{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);
  border-radius:999px;padding:6px 12px;
  font-size:12px;font-weight:700;color:#fff;cursor:pointer;
  white-space:nowrap;transition:background .15s;
}
.top-btn:hover{background:rgba(255,255,255,.30);}
.top-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.top-more-btn{display:none;}
@media (max-width:600px){
  .top-btn-secondary{display:none;}
  .top-bar.top-more-open .top-btn-secondary{display:flex;}
  .top-more-btn{display:flex;}
}
/* 기존 .history-btn 호환 (다른 곳 참조 없음) */
.history-btn{display:none;}
/* ── 주문 내역 페이지 ── */
.hist-empty{text-align:center;padding:60px 20px;color:var(--light);}
.hist-empty span{font-size:48px;display:block;margin-bottom:12px;}
/* ── 주문내역 간단 리스트 ── */
.hist-list{padding:0 14px;}
.hist-li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .1s,box-shadow .15s;}
.hist-li:active{transform:scale(.99);}

/* ── 나의 기록 페이지 ── */
.trk-section-title{font-size:14px;font-weight:800;color:#086266;margin:18px 14px 8px;}

.trk-summary-row{display:flex;gap:10px;padding:0 14px;margin-bottom:4px;}
.trk-stat{flex:1;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:center;}

.trk-stat-label{font-size:12px;color:var(--sub);margin-top:2px;}

.trk-reason{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.5;}
.trk-rank{width:22px;height:22px;border-radius:50%;background:#f4fafa;color:#086266;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.trk-del-btn{flex-shrink:0;}
.trk-more-hidden{display:none;}
.trk-more-btn{text-align:center;padding:11px;color:var(--teal);font-size:13px;font-weight:700;cursor:pointer;background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;}
/* ── 주문 상세 팝업 ── */
.order-detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:600;display:none;align-items:flex-start;justify-content:center;padding:18px 8px 40px;overflow-y:auto;}
.order-detail-overlay.open{display:flex;}
.order-detail-modal{position:relative;width:100%;max-width:440px;}
.order-detail-close{display:block;margin:0 14px 8px auto;width:34px;height:34px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:15px;color:#666;cursor:pointer;}
.hist-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin:0 14px 12px;overflow:hidden;}
.hist-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#f4fafa;border-bottom:1px solid #e8f5f4;}

.hist-status.confirmed{background:#d1e7dd;color:#0f5132;}
.hist-status.delivered{background:#cfe2ff;color:#084298;}
.hist-status.cancelled{background:#f8d7da;color:#842029;}

.hist-item-qty-ctrl span{width:30px;text-align:center;font-size:13px;font-weight:700;}
.hist-item-del{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:3px;}

.hist-item-price{font-size:13px;font-weight:700;color:var(--teal);min-width:54px;text-align:right;}
.hist-total{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:2px solid #e8f5f4;font-size:14px;font-weight:700;}

.hist-actions{display:flex;gap:8px;padding:10px 14px 14px;}
.order-memo-row{font-size:12px;color:#b8860b;background:#fff8e1;padding:6px 14px;line-height:1.5;}
.order-addreq-row{color:#086266;background:#f0faf9;}
.order-delivery-fee-row{display:none;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px;font-weight:600;color:#c2500a;border-top:1px dashed #f5cba7;}
.pickup-recommend-banner{background:#fff7e6;border:1.5px solid #f59e0b;border-radius:10px;padding:14px 16px;margin:0 14px 14px;color:#78350f;font-size:13px;line-height:1.6;}
.pickup-recommend-actions{display:flex;gap:8px;margin-top:10px;}
.btn-pickup-yes{background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-pickup-no{background:transparent;color:#92400e;border:1.5px solid #f59e0b;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}
.hist-req-wrap{padding:4px 14px;}
.hist-req-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;padding:5px 0;}
.hist-req-row span{flex:1;color:#555;}

.hist-req-edit-btn{flex-shrink:0;background:none;border:1.5px solid #9adcda;border-radius:8px;font-size:12px;font-weight:700;color:#086266;cursor:pointer;padding:4px 8px;opacity:.85;font-family:inherit;}
.hist-req-edit-btn:hover{opacity:1;}
.hist-req-add-btn{width:100%;padding:6px;border:1.5px dashed #cde8e7;border-radius:8px;background:#f9fffe;color:#086266;font-size:12px;cursor:pointer;font-family:inherit;}

.hist-req-actions{display:flex;gap:6px;margin-top:4px;}
.hist-req-cancel{flex:1;padding:7px;border-radius:8px;border:1.5px solid #ddd;background:#fff;color:#666;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.hist-req-save{flex:1;padding:7px;border-radius:8px;border:none;background:#086266;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.hist-btn-cancel{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid #f5c0c0;background:#fff;color:var(--red);cursor:pointer;}
.hist-btn-delete{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid #f5a623;background:#fff;color:#f5a623;cursor:pointer;}
.hist-btn-order-cancel{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid #f5c0c0;background:#fff;color:var(--red);cursor:pointer;}
.hist-btn-save{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;border:none;background:var(--teal);color:#fff;cursor:pointer;}
/* ── 추가 요청 ── */
.extra-req-wrap{padding:0 14px 12px;}
.extra-req-btn{width:100%;padding:9px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px dashed #cde8e7;background:#f9fffe;color:#086266;cursor:pointer;font-family:inherit;transition:background .15s;}
.extra-req-btn:active{background:#e8f5f4;}
.extra-req-area{width:100%;border:1.5px solid #cde8e7;border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:80px;outline:none;color:#333;box-sizing:border-box;}
.extra-req-area:focus{border-color:#086266;}
.extra-req-actions{display:flex;gap:8px;margin-top:8px;}
.extra-req-cancel{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid #ddd;background:#fff;color:#666;cursor:pointer;font-family:inherit;}
.extra-req-save{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;border:none;background:#086266;color:#fff;cursor:pointer;font-family:inherit;}
.extra-req-save:disabled{opacity:.6;}
.extra-req-saved{display:flex;align-items:center;gap:8px;font-size:13px;color:#086266;background:#f0faf9;border-radius:0;padding:7px 14px;margin:0 -14px;line-height:1.5;word-break:break-all;}
.extra-req-saved-text{flex:1;}
.extra-req-edit-btn{flex-shrink:0;background:none;border:1.5px solid #9adcda;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;color:#086266;padding:4px 8px;line-height:1.4;opacity:.85;font-family:inherit;}
.extra-req-edit-btn:hover{opacity:1;}
/* ── 관리자 답변 채팅 버블 ── */
.admin-reply-section{padding:0 14px 12px;display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.admin-reply-header{font-size:11px;font-weight:700;color:#086266;white-space:nowrap;flex-shrink:0;}

  box-shadow:0 2px 8px rgba(8,98,102,.2);
}

/* ── 요청사항 셀렉트 ── */

}

/* ── 예약주문 페이지 ── */
.reserve-event-card{margin:10px 12px 0;background:linear-gradient(135deg,#086266,#1D9E75);border-radius:14px;padding:16px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(8,98,102,.28);}

.reserve-menu-list{padding:0 12px 80px;}

.reserve-menu-emoji{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
.reserve-menu-info{flex:1;min-width:0;}
.reserve-menu-name{font-size:13px;font-weight:700;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.rf-label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:8px;}
.rf-options{display:flex;flex-wrap:wrap;gap:6px;}
.rf-opt{background:#f2f7f6;border:1.5px solid #d5e6e4;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:#086266;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;}
.rf-opt:hover{background:#e0f0ee;}
.rf-opt.selected{background:#086266;color:#fff;border-color:#086266;}
.rf-opt-na{border-style:dashed;color:#999;}
.rf-opt-na.selected{background:#888;border-color:#888;color:#fff;}
.rf-input{width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid #d5e6e4;font-family:inherit;font-size:14px;outline:none;box-sizing:border-box;}
.rf-input:focus{border-color:#086266;}
.rf-run-btn{width:100%;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .12s;}
.rf-run-btn:hover{background:#0a7a7f;}
.rf-run-btn:disabled{background:#aac9c8;cursor:default;}
.rf-result{margin-top:4px;padding:16px 0 6px;border-top:1px solid #eee;}
.rf-result-text{font-size:14px;color:#333;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;}
.rf-result-actions{display:flex;gap:8px;}
.rf-result-actions .rf-run-btn{flex:1;}
.rf-cancel-btn{flex:1;padding:12px;background:#eee;color:#555;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .12s;}
.rf-cancel-btn:hover{background:#e0e0e0;}
</style>
</head>

<script>

function parseCsvLine(line){
  var result=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(inQ){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
    else{if(c==='"'){inQ=true;}else if(c===','){result.push(cur.trim());cur='';}else cur+=c;}
  }
  result.push(cur.trim());
  return result;
}

function toISO(d){
  // 한국 시간(UTC+9) 기준으로 날짜 계산
  var kst=new Date(d.getTime()+9*60*60*1000);
  return kst.getUTCFullYear()+'-'+String(kst.getUTCMonth()+1).padStart(2,'0')+'-'+String(kst.getUTCDate()).padStart(2,'0');
}
function comma(n){return Number(n).toLocaleString();}
function formatPhone(p){
  p=(p||'').replace(/[^0-9]/g,'');
  if(p.length===11) return p.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(p.length===10) return p.indexOf('02')===0?p.replace(/(\d{2})(\d{4})(\d{4})/,'$1-$2-$3'):p.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  if(p.length===9) return p.replace(/(\d{2})(\d{3})(\d{4})/,'$1-$2-$3');
  return p;
}
function fmtDT(date,time){
  var DAYS=['일','월','화','수','목','금','토'];
  var p=(date||'').split('-');
  var mmdd=p.length>=3?p[1]+'/'+p[2]:(date||'');
  var dow='';
  if(p.length>=3){
    var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
    dow=DAYS[d.getDay()]+'요일';
  }
  var t=String(time||'');
  var isPM=/오후|PM/i.test(t);
  var isAM=/오전|AM/i.test(t);
  var m=t.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
  var hhmm='';
  if(m){
    var h=parseInt(m[1]),mn=m[2];
    if(isPM&&h!==12)h+=12;
    if(isAM&&h===12)h=0;
    var ap=h>=12?'PM':'AM',h12=h%12||12;
    hhmm=String(h12).padStart(2,'0')+':'+mn+' '+ap;
  }
  return mmdd+(dow?' '+dow:'')+(hhmm?' '+hhmm:'');
}

}

var RF_SINGLE_IDS=['rfPurpose','rfMealType','rfCuisine','rfBroth','rfTemp','rfMealKit','rfBudget'];
var RF_MULTI_IDS=['rfTaste','rfDiet','rfDrinks'];
var rfSingleVals={},rfMultiVals={};
RF_SINGLE_IDS.forEach(function(id){
  rfSingleVals[id]='';
  var el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('click',function(e){
    var btn=e.target.closest('.rf-opt');
    if(!btn)return;
    var already=btn.classList.contains('selected');
    el.querySelectorAll('.rf-opt').forEach(function(b){b.classList.remove('selected');});
    if(!already){btn.classList.add('selected');rfSingleVals[id]=btn.dataset.val;}
    else rfSingleVals[id]='';
  });
});
RF_MULTI_IDS.forEach(function(id){
  rfMultiVals[id]=new Set();
  var el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('click',function(e){
    var btn=e.target.closest('.rf-opt');
    if(!btn)return;
    if(btn.dataset.val===''){
      // 해당없음: 이 항목만 선택 상태로 두고 나머지는 모두 해제
      el.querySelectorAll('.rf-opt').forEach(function(b){b.classList.remove('selected');});
      rfMultiVals[id].clear();
      btn.classList.add('selected');
      return;
    }
    var naBtn=el.querySelector('.rf-opt[data-val=""]');
    if(naBtn)naBtn.classList.remove('selected');
    btn.classList.toggle('selected');
    if(btn.classList.contains('selected'))rfMultiVals[id].add(btn.dataset.val);
    else rfMultiVals[id].delete(btn.dataset.val);
  });
});

    id='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);
    });
    localStorage.setItem(k,id);
  }
  return id;
}
// 메뉴 상세를 열어볼 때마다 '나의 기록 > 자주 살펴본 메뉴'용으로 기록. 실패해도 화면엔 영향 없음.
function trackMenuClick(name,cat){
  fetch(API_URL+'/api/track/menu-click',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({deviceId:getDeviceId(),name:name,cat:cat}),
  }).catch(function(){});
}
function loadMenus(silent,cb){
  var iso=toISO(new Date());
  menuDate=iso;
  var label=new Date(iso+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  if(!silent)document.getElementById('dateBannerText').textContent='📅 '+label+' 오늘의 메뉴 불러오는 중...';

  fetch(API_URL+'/api/menu/'+iso,{cache:'no-store'})
    .then(function(r){
      // 404 = 관리자가 오늘 메뉴를 전부 삭제한 정상 상태 — 네트워크 오류와 다르게 항상 화면에 반영해야 한다.
      // 예전엔 이것도 catch로 떨어져 silent(자동 새로고침)일 때 무시돼, 전체 삭제 후에도
      // 고객 화면에 옛 메뉴가 계속 남아 있는 문제가 있었다(2026-08-08 발견).
      if(r.status===404)return {menus:[]};
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){
      allMenus=[];
      (d.menus||[]).forEach(function(m,i){
        allMenus.push({id:i+1,menuId:(m.menuId!=null?m.menuId:null),name:m.name,cat:m.cat||'기타',
          price:Number(m.price)||0,stock:Number(m.stock)||0,
          child:!!m.child,imgUrl:m.imgUrl||null,icon:m.icon||null,desc:''});
      });
      document.getElementById('dateBannerText').textContent='📅 '+label+(allMenus.length?' 오늘의 메뉴':' 준비 중입니다');
      renderCatTabs();renderMenuGrid();
      if(cb)cb();
    })
    .catch(function(){
      // 네트워크 오류 등 진짜 실패일 때만 silent 가드 — 일시적 통신 장애로 화면을 비우지 않기 위함
      if(!silent){
        document.getElementById('dateBannerText').textContent='📅 '+label+' 불러오기 실패';
      }
      if(cb)cb();
    });
}

// ── 메뉴 자동 새로고침 (idle 4초마다 재조회 + 카운트다운 표시) ──
var _MENU_REFRESH_SEC=4;   // 이 값 하나만 바꾸면 초기값·리셋 지점 전부 같이 바뀐다
var _refreshSec=_MENU_REFRESH_SEC;
function _setRefreshLabel(txt){var el=document.getElementById('dateRefreshCountdown');if(el)el.textContent=txt;}
function _markMenuActivity(){_refreshSec=_MENU_REFRESH_SEC;}
function _startMenuAutoRefresh(){
  setInterval(function(){
    var listActive=document.getElementById('page-list')&&document.getElementById('page-list').classList.contains('active');
    var modalOpen=!!document.querySelector('.menu-modal-overlay');
    if(!listActive||modalOpen||document.hidden){_setRefreshLabel('🔄 대기');return;}
    _refreshSec--;
    if(_refreshSec<=0){
      _setRefreshLabel('🔄 갱신중');
      loadMenus(true);
      _refreshSec=_MENU_REFRESH_SEC;
    }else{
      _setRefreshLabel('🔄 '+_refreshSec);
    }
  },1000);
}
['click','scroll','keydown','touchstart'].forEach(function(ev){
  document.addEventListener(ev,_markMenuActivity,{passive:true});
});

// ── 카테고리 탭 ──
function renderCatTabs(){
  var cats=['전체'];
  Object.keys(CAT_COLOR).forEach(function(c){
    if(allMenus.some(function(m){return m.cat===c;}))cats.push(c);
  });
  if(cats.indexOf('기타')<0)cats.push('기타');
  if(allMenus.some(function(m){return m.child;}))cats.push('어린이');
  var tabs=document.getElementById('catTabs');
  tabs.innerHTML='';
  var ROW1_MAX=5;
  var row1cats=cats.slice(0,ROW1_MAX);
  var row2cats=cats.slice(ROW1_MAX);
  function makeBtn(c){
    var btn=document.createElement('button');
    btn.className='cat-tab'+(filterCat===c?' active':'');
    btn.textContent=c;
    btn.onclick=function(){setCat(c);};
    return btn;
  }
  var row1=document.createElement('div');
  row1.className='cat-tabs-row row1';
  row1cats.forEach(function(c){row1.appendChild(makeBtn(c));});
  tabs.appendChild(row1);
  if(row2cats.length){
    var row2=document.createElement('div');
    row2.className='cat-tabs-row row2';
    row2cats.forEach(function(c){row2.appendChild(makeBtn(c));});
    tabs.appendChild(row2);
  }
}
function setCat(cat){filterCat=cat;renderCatTabs();renderMenuGrid();}

// ── 메뉴 그리드 ──
function renderMenuGrid(){
  var filtered=filterCat==='전체'?allMenus:filterCat==='어린이'?allMenus.filter(function(m){return m.child;}):allMenus.filter(function(m){return m.cat===filterCat;});
  var grid=document.getElementById('menuGrid');
  var noMenu=document.getElementById('noMenu');
  if(!filtered.length){grid.innerHTML='';noMenu.style.display='block';return;}
  noMenu.style.display='none';
  grid.innerHTML='';
  filtered.forEach(function(m){
    var prep=(m.stock===-1);              // 조리준비중
    var soldout=(m.stock||0)===0;         // 품절
    var unavailable=soldout||prep;
    var card=document.createElement('div');
    card.className='menu-card'+(m.child&&!unavailable?' child-ok':'')+(unavailable?' soldout':'');
    // 썸네일 (이미지 or 이모지)
    var dot=document.createElement('div');
    dot.className='menu-thumb';
    var _ic=_validUrl(m.icon)||_validUrl(m.imgUrl);
    if(_ic){var ti=document.createElement('img');ti.src=_ic;ti.alt=m.name;ti.onerror=function(){this.parentNode.textContent=getMenuEmoji(m.name,m.cat);};dot.appendChild(ti);}
    else{dot.textContent=getMenuEmoji(m.name,m.cat);}
    if(unavailable)dot.style.opacity='.45';
    else{dot.style.cursor='pointer';(function(mid){dot.onclick=function(e){e.stopPropagation();showMenuModal(mid);};})(String(m.id));}

    // 중간 컬럼
    var midCol=document.createElement('div');
    midCol.className='menu-mid';
    // 메뉴명 wrap — 메뉴명 클릭 시 상세 팝업
    var nameWrap=document.createElement('div');
    nameWrap.className='menu-name-wrap';
    var nameEl=document.createElement('div');
    nameEl.className='menu-name';
    nameEl.style.cssText='cursor:pointer;text-decoration:underline dotted #aaa;';
    nameEl.textContent=menuDisplayName(m.name,m.cat);
    (function(mid){nameEl.onclick=function(e){e.stopPropagation();showMenuModal(mid);};})(String(m.id));
    nameWrap.appendChild(nameEl);
    if(m.child&&!unavailable){
      var childTag=document.createElement('span');
      childTag.className='menu-child-tag';
      childTag.textContent='👧';
      nameWrap.appendChild(childTag);
    }

    // 가격 또는 품절/조리준비중
    var priceEl=document.createElement('div');
    if(unavailable){
      var stag=document.createElement('span');
      stag.className='menu-soldout-tag';
      stag.textContent=prep?'조리준비중':'품절';
      midCol.appendChild(nameWrap);
      card.appendChild(dot);
      card.appendChild(midCol);
      card.appendChild(stag);
    } else {
      priceEl.className='menu-price';
      priceEl.textContent=comma(m.price)+'천원';
      if((m.stock||0)>0&&(m.stock||0)<=3){
        var stockTag=document.createElement('span');
        stockTag.className='menu-stock-tag low';
        stockTag.textContent='⚠ '+(m.stock||0)+'개 남음';
        nameWrap.appendChild(stockTag);
      }
      midCol.appendChild(nameWrap);
      var chk=document.createElement('div');
      chk.className='menu-chk'+(selectedMenuIds.has(String(m.id))?' checked':'');
      (function(mid,chkEl,cardEl){
        chkEl.onclick=function(e){
          e.stopPropagation();
          if(selectedMenuIds.has(mid)){selectedMenuIds.delete(mid);chkEl.classList.remove('checked');cardEl.classList.remove('selected');}
          else{selectedMenuIds.add(mid);chkEl.classList.add('checked');cardEl.classList.add('selected');}
          updateFloatCartBtn();
        };
      })(String(m.id),chk,card);
      if(selectedMenuIds.has(String(m.id)))card.classList.add('selected');
      card.appendChild(dot);
      card.appendChild(midCol);
      card.appendChild(priceEl);
      card.appendChild(chk);
    }
    grid.appendChild(card);
  });
}

// ── 메뉴 상세 팝업 ──
function showMenuModal(id){
  var m=allMenus.find(function(x){return String(x.id)===String(id);});
  if(!m)return;
  trackMenuClick(m.name,m.cat);
  var overlay=document.createElement('div');
  overlay.className='menu-modal-overlay';
  overlay.onclick=function(e){if(e.target===overlay)document.body.removeChild(overlay);};

  modal.className='menu-modal';
  // 이미지
  var imgWrap=document.createElement('div');
  imgWrap.className='menu-modal-img';
  var _modalImg=_validUrl(m.imgUrl)||_validUrl(m.icon);
  if(_modalImg){var img=document.createElement('img');img.src=_modalImg;img.alt=m.name;img.onerror=function(){imgWrap.textContent=getMenuEmoji(m.name,m.cat);};imgWrap.appendChild(img);if(_isPexels(_modalImg)){var _b=document.createElement('span');_b.className='tmp-img-badge';_b.textContent='임시 이미지';imgWrap.appendChild(_b);}if(_isAiImg(_modalImg)){var _ab=document.createElement('span');_ab.className='tmp-img-badge';_ab.textContent='실제 제품과 다를 수 있습니다';imgWrap.appendChild(_ab);}}
  else{imgWrap.textContent=getMenuEmoji(m.name,m.cat);}
  // 닫기 버튼
  var closeBtn=document.createElement('button');
  closeBtn.className='menu-modal-close';
  closeBtn.textContent='✕';
  closeBtn.onclick=function(){document.body.removeChild(overlay);};
  // 바디
  var body=document.createElement('div');
  body.className='menu-modal-body';
  // 배지
  var badges=document.createElement('div');
  badges.className='detail-badges';
  var catB=document.createElement('span');
  catB.className='badge badge-cat';
  catB.style.background=CAT_COLOR[m.cat]||'#888';
  catB.textContent=m.cat;
  badges.appendChild(catB);
  if(m.child){var cb2=document.createElement('span');cb2.className='badge badge-child';cb2.style.cssText='font-size:12px;padding:3px 10px;';cb2.textContent='어린이도 OK';badges.appendChild(cb2);}
  if(m.stock===-1){var prb=document.createElement('span');prb.className='badge';prb.style.cssText='background:#fff3e0;color:#e08600;';prb.textContent='조리준비중';badges.appendChild(prb);}
  else if((m.stock||0)===0){var sob=document.createElement('span');sob.className='badge';sob.style.cssText='background:#f0f0f0;color:#999;';sob.textContent='품절';badges.appendChild(sob);}
  var nameEl=document.createElement('div');
  nameEl.className='menu-modal-name';
  nameEl.textContent=menuDisplayName(m.name,m.cat);
  var priceEl=document.createElement('div');
  priceEl.className='menu-modal-price';
  priceEl.innerHTML=comma(m.price)+'<span>천원</span>';
  body.appendChild(badges);
  body.appendChild(nameEl);
  body.appendChild(priceEl);
  if(m.desc){
    var descEl=document.createElement('div');
    descEl.className='menu-modal-desc';
    descEl.textContent=m.desc;
    body.appendChild(descEl);
  }
  // 장바구니 버튼
  var actWrap=document.createElement('div');
  actWrap.className='menu-modal-actions';
  var cartBtn=document.createElement('button');
  var soldOut=(m.stock||0)===0||m.stock===-1;
  cartBtn.className='menu-modal-cart-btn'+(soldOut?' sold-out':'');
  cartBtn.disabled=soldOut;
  cartBtn.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61H19a2 2 0 001.99-1.77L22 6H6"/></svg>'+(soldOut?'품절':'장바구니 담기');
  cartBtn.onclick=function(){
    if(soldOut)return;
    var ex=cart.find(function(c){return c.name===m.name;});
    if(ex){ex.qty++;}
    else{cart.push({menuId:(m.menuId!=null?m.menuId:null),name:m.name,cat:m.cat||'',price:m.price,qty:1,imgUrl:m.imgUrl||null,child:m.child,checked:true});}
    updateCartCount();
    document.body.removeChild(overlay);
  };
  var closeBtn2=document.createElement('button');
  closeBtn2.style.cssText='background:#eee;color:#555;border:none;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;';
  closeBtn2.textContent='닫기';

  actWrap.appendChild(cartBtn);
  actWrap.appendChild(closeBtn2);
  modal.appendChild(imgWrap);
  modal.appendChild(closeBtn);
  modal.appendChild(body);
  modal.appendChild(actWrap);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}
// ── 장바구니 ──
function updateCartCount(){
  var cnt=cart.reduce(function(s,c){return s+c.qty;},0);
  var el=document.getElementById('cartCount');
  el.textContent=cnt;
  if(cnt>0)el.classList.add('on');else el.classList.remove('on');
}

// ── 주문 접수 상태 팝업 ──
function _extraSavedHtml(id,text,editable){
  var safe=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="extra-req-saved">'
    +'<span class="extra-req-saved-text">✅ '+safe+'</span>'
    +(editable?'<button class="extra-req-edit-btn" onclick="editExtraReq(\''+id+'\')" title="편집">✏️ 수정</button>':'')
    +'</div>';
}
function editExtraReq(id){
  // 현재 저장된 텍스트 가져오기
  var ords=JSON.parse(localStorage.getItem('orders')||'[]');
  var ord=ords.find(function(o){return o.id===id;})||{};
  var prev=ord.additionalRequest||'';
  var wrap=document.getElementById('extra_'+id);
  wrap.innerHTML=
    '<textarea class="extra-req-area" placeholder="추가 요청 사항을 입력하세요...">'+
      String(prev).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+
    '</textarea>'+
    '<div class="extra-req-actions">'+
      '<button class="extra-req-cancel" onclick="cancelExtraReq(\''+id+'\')">취소</button>'+
      '<button class="extra-req-save" onclick="saveExtraReq(\''+id+'\')">저장</button>'+
    '</div>';
  wrap.querySelector('textarea').focus();
}
function toggleExtraReq(id){
  var wrap=document.getElementById('extra_'+id);
  wrap.innerHTML=
    '<textarea class="extra-req-area" placeholder="추가 요청 사항을 입력하세요..."></textarea>'+
    '<div class="extra-req-actions">'+
      '<button class="extra-req-cancel" onclick="cancelExtraReq(\''+id+'\')">취소</button>'+
      '<button class="extra-req-save" onclick="saveExtraReq(\''+id+'\')">저장</button>'+
    '</div>';
  wrap.querySelector('textarea').focus();
}
function cancelExtraReq(id){
  var wrap=document.getElementById('extra_'+id);
  var ords=JSON.parse(localStorage.getItem('orders')||'[]');
  var ord=ords.find(function(o){return o.id===id;});
  var prev=ord&&ord.additionalRequest?ord.additionalRequest:'';
  var isPending=ord&&ord.status==='pending';
  wrap.innerHTML=prev
    ?_extraSavedHtml(id,prev,isPending)
    :'<button class="extra-req-btn" onclick="toggleExtraReq(\''+id+'\')">✏️ 추가 요청</button>';
}
function saveExtraReq(id){
  var wrap=document.getElementById('extra_'+id);
  var ta=wrap.querySelector('textarea');
  var text=(ta.value||'').trim();
  if(!text){showToast('내용을 입력해주세요.');return;}
  var btn=wrap.querySelector('.extra-req-save');
  btn.disabled=true; btn.textContent='저장 중...';
  fetch(API_URL+'/api/orders/'+encodeURIComponent(id)+'/request',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d&&d.success){
      showToast('✅ 추가 요청이 저장됐어요.');
      wrap.innerHTML=_extraSavedHtml(id,text,true);
    } else {
      showToast('⚠️ '+(d.error||d.message||'저장 실패'));
      btn.disabled=false; btn.textContent='저장';
    }
  })
  .catch(function(){
    showToast('⚠️ 연결 오류');
    btn.disabled=false; btn.textContent='저장';
  });
}
function renderCart(){
  var el=document.getElementById('cartContent');
  el.innerHTML='';
  if(!cart.length){
    el.innerHTML='<div class="empty-cart"><span>🛒</span><p>장바구니가 비어있어요.<br>메뉴를 담아보세요!</p></div>';
    return;
  }
  var listWrap=document.createElement('div');
  listWrap.className='cart-list';

  cart.forEach(function(c,i){
    var item=document.createElement('div');
    item.className='cart-item';

    var chk=document.createElement('input');
    chk.type='checkbox'; chk.className='cart-check'; chk.checked=c.checked;
    chk.onchange=function(){toggleCheck(i,this.checked);};

    var thumb=document.createElement('div');
    thumb.className='cart-thumb';
    if(c.imgUrl){
      var ti=document.createElement('img');
      ti.src=c.imgUrl; ti.alt=c.name;
      thumb.appendChild(ti);
    } else { thumb.textContent=getMenuEmoji(c.name,c.cat||''); }

    var info=document.createElement('div');
    info.className='cart-info';
    info.innerHTML='<div class="cart-iname">'+menuDisplayName(c.name,c.cat||'')+'</div>'
      +'<div class="cart-iprice">'+comma(c.price*c.qty)+'천원</div>';

    var qtyCtrl=document.createElement('div');
    qtyCtrl.className='cart-qty-ctrl';
    var qm=document.createElement('button'); qm.textContent='-';
    qm.onclick=function(){cartQty(i,-1);};
    var qs=document.createElement('span'); qs.textContent=c.qty;
    var qp=document.createElement('button'); qp.textContent='+';
    qp.onclick=function(){cartQty(i,1);};
    qtyCtrl.appendChild(qm); qtyCtrl.appendChild(qs); qtyCtrl.appendChild(qp);

    var del=document.createElement('button');
    del.className='cart-del'; del.textContent='✕';
    del.onclick=function(){cartDel(i);};

    item.appendChild(chk); item.appendChild(thumb);
    item.appendChild(info); item.appendChild(qtyCtrl); item.appendChild(del);
    listWrap.appendChild(item);
  });
  el.appendChild(listWrap);

  var checked=cart.filter(function(c){return c.checked;});
  var total=checked.reduce(function(s,c){return s+c.price*c.qty;},0);
  var allChk=cart.length>0&&cart.every(function(c){return c.checked;});

  var summary=document.createElement('div');
  summary.className='cart-summary';
  var deliveryLine=total>0
    ?(total>=20
      ?'<div class="sum-delivery-info ok">🚚 배달 가능 — 배달료 1천원 추가됩니다</div>'
      :'<div class="sum-delivery-info warn">⚠ 2만원 이상 주문 시 배달 가능 (현재 '+(20-total)+'천원 부족)</div>')
    :'';
  summary.innerHTML='<div class="cart-summary-row"><span class="sum-label">선택 항목</span><span class="sum-value">'+checked.length+'개</span></div>'
    +'<div class="cart-summary-row"><span class="sum-label">합계금액</span><span class="sum-value sum-total">'+comma(total)+'천원</span></div>'
    +deliveryLine;
  el.appendChild(summary);

  var actions=document.createElement('div');
  actions.className='cart-actions';

  var btnAll=document.createElement('button');
  btnAll.className='btn-select-all';
  btnAll.textContent=allChk?'전체해제':'전체선택';
  btnAll.onclick=function(){toggleAll(!allChk);};

  var btnDel=document.createElement('button');
  btnDel.className='cart-del-sel';
  btnDel.textContent='선택삭제';
  btnDel.onclick=delSelected;

  var btnOrd=document.createElement('button');
  btnOrd.className='btn-cart-order';
  btnOrd.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="20" height="20"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/></svg>주문하기';
  btnOrd.onclick=cartOrder;

  var btnCancel=document.createElement('button');
  btnCancel.className='btn-select-all';
  btnCancel.textContent='취소';
  btnCancel.onclick=function(){goPage('list');};

  actions.appendChild(btnAll); actions.appendChild(btnDel); actions.appendChild(btnOrd); actions.appendChild(btnCancel);
  el.appendChild(actions);
}
function toggleCheck(i,v){cart[i].checked=v;renderCart();}
function toggleAll(v){cart.forEach(function(c){c.checked=v;});renderCart();}
function cartQty(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);updateCartCount();renderCart();}
function cartDel(i){cart.splice(i,1);updateCartCount();renderCart();}
function delSelected(){cart=cart.filter(function(c){return !c.checked;});updateCartCount();renderCart();}
function cartOrder(){
  orderItems=cart.filter(function(c){return c.checked;});
  if(!orderItems.length){showToast('주문할 항목을 선택해주세요.');return;}
  goPage('orderer');
  renderOrdererPage();
}

    row.appendChild(nm); row.appendChild(qty); row.appendChild(pr);
    box.appendChild(row);

  var feeRow=document.createElement('div');
  feeRow.id='ordererDeliveryFeeRow';
  feeRow.className='order-delivery-fee-row';
  feeRow.innerHTML='<span>🚚 배달료</span><span>+1천원</span>';
  box.appendChild(feeRow);
  var tot=document.createElement('div');
  tot.className='order-summary-total';
  tot.innerHTML='<span class="order-summary-total-lbl">합계</span><span class="order-summary-total-amt" id="ordererSummaryTotal">'+total.toLocaleString()+'천원</span>';
  box.appendChild(tot);

  btn.onclick=function(){
    var name=document.getElementById('ordererName').value.trim();
    if(!name){showToast('이름을 입력해주세요.');document.getElementById('ordererName').focus();return;}
    var phone=document.getElementById('ordererPhone').value.trim();
    if(!phone){showToast('연락처를 입력해주세요.');document.getElementById('ordererPhone').focus();return;}
    var memo=document.getElementById('ordererMemo').value;
    var addr=document.getElementById('ordererAddr').value.trim();

    var _itemsTotal=orderItems.reduce(function(s,c){return s+c.price*c.qty;},0);

    var _btnHtml=btn.innerHTML;
    function _unlock(){btn.disabled=false;btn.innerHTML=_btnHtml;}
    btn.disabled=true;btn.textContent='처리 중...';
    verifyStock(function(ok,short){
      if(!ok){_unlock();_notifyOutOfStock(short);return;}
      saveOrder(function(result){
        if(!result.success){_unlock();_notifyOutOfStock((result.soldOut||[]).map(function(s){return{name:s.name,have:s.available,want:'?'};}));return;}
        cart=[];orderItems=[];updateCartCount();
        goPage('payment');
        loadMenus(true);
      });
    });
  };

// ── 배달료 ──
var _deliveryFee=0;
function _updateDeliveryFee(){
  var memoEl=document.getElementById('ordererMemo');
  if(!memoEl)return;
  var memo=memoEl.value;
  var itemsTotal=orderItems.reduce(function(s,c){return s+c.price*c.qty;},0);
  var isPickup=(memo==='매장픽업');
  var hasDelivery=(!isPickup&&!!memo);
  _deliveryFee=0;
  var feeRow=document.getElementById('ordererDeliveryFeeRow');
  var totalEl=document.getElementById('ordererSummaryTotal');
  var banner=document.getElementById('pickupRecommendBanner');
  if(!hasDelivery||itemsTotal>=20){if(banner)banner.remove();}
  if(!hasDelivery){
    if(feeRow)feeRow.style.display='none';
    if(totalEl)totalEl.textContent=itemsTotal.toLocaleString()+'천원';
    return;
  }
  if(itemsTotal>=20){
    _deliveryFee=1;
    if(feeRow)feeRow.style.display='flex';
    if(totalEl)totalEl.textContent=(itemsTotal+1).toLocaleString()+'천원';
  } else {
    if(feeRow)feeRow.style.display='none';
    if(totalEl)totalEl.textContent=itemsTotal.toLocaleString()+'천원';
    if(itemsTotal>0&&!document.getElementById('pickupRecommendBanner'))_showPickupRecommend();
  }
}
function _showPickupRecommend(){
  var banner=document.createElement('div');
  banner.id='pickupRecommendBanner';
  banner.className='pickup-recommend-banner';
  banner.innerHTML='<div>🚫 2만원 미만 주문은 <strong>매장 픽업</strong>만 가능해요!</div>'
    +'<div class="pickup-recommend-actions">'
    +'<button class="btn-pickup-yes" onclick="_pickPickup()">매장 픽업으로 변경</button>'
    +'<button class="btn-pickup-no" onclick="document.getElementById(\'pickupRecommendBanner\').remove()">취소</button>'
    +'</div>';
  var target=document.getElementById('ordererOrderContent');
  if(target)target.insertBefore(banner,target.firstChild);
}
function _pickPickup(){
  var memoEl=document.getElementById('ordererMemo');
  if(memoEl){memoEl.value='매장픽업';_updateDeliveryFee();}
  var banner=document.getElementById('pickupRecommendBanner');
  if(banner)banner.remove();
}

function _buildAddrItem(c, isMaster){
  var wrap=document.createElement('div');

  wrap.appendChild(header);

  if(isMaster){
    // 주소1/2/3 — 각 행 우측에 선택 버튼

      row.appendChild(label);row.appendChild(txt);row.appendChild(selBtn);

    });
    if(c.memo){

    closeBtn.className='btn-addr-del';closeBtn.textContent='닫기';

      e.stopPropagation();
      document.getElementById('addrListOverlay').style.display='none';
    };

      fetch(API_URL+'/api/customers-master',{method:'POST',headers:{'Content-Type':'application/json'},

        .then(function(){
          var phoneId=_addrTarget==='reserve'?'reservePhone':'ordererPhone';
          var ph=(document.getElementById(phoneId).value||'').replace(/[^0-9]/g,'');

// ── 주문 직전 최신 재고 확인 (동시 주문 품절 방지) ──
function verifyStock(onResult){
  var iso=toISO(new Date());
  fetch(API_URL+'/api/menu/'+iso,{cache:'no-store'})
    .then(function(r){
      // 404 = 관리자가 오늘 메뉴를 전부 삭제한 상태 — 장바구니에 남은 항목은 전부 품절로 취급해야 한다.
      // 예전엔 이것도 catch로 떨어져 "이상 없음"으로 통과시켰다(서버가 최종 저지는 하지만,
      // 그러면 고객은 "재고 부족"이라는 부정확한 사유로 주문이 막힌다).
      if(r.status===404)return {menus:[]};
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){
      var stockByName={},stockById={};
      (d.menus||[]).forEach(function(m){
        stockByName[m.name]=Number(m.stock)||0;
        if(m.menuId!=null)stockById[m.menuId]=Number(m.stock)||0;
      });
      var short=[];
      orderItems.forEach(function(it){
        var avail;
        if(it.menuId!=null&&stockById.hasOwnProperty(it.menuId))avail=stockById[it.menuId];
        else avail=stockByName.hasOwnProperty(it.name)?stockByName[it.name]:0;
        if(avail<it.qty)short.push({name:it.name,want:it.qty,have:avail});
      });
      onResult(short.length===0,short);
    })
    .catch(function(){onResult(true,[]);});
}
function _notifyOutOfStock(list){
  var msg=list.map(function(s){return '• '+s.name+' (남은 재고 '+s.have+'개 / 주문 '+s.want+'개)';}).join('\n');
  alert('죄송합니다. 방금 재고가 변경되어 아래 메뉴를 주문할 수 없습니다:\n\n'+msg+'\n\n메뉴를 다시 확인해주세요.');
  selectedMenuIds.clear();
  cart=[];orderItems=[];updateCartCount();
  loadMenus();
  goPage('list');
}

// ── 주문 저장 + SMS 발송 (서버 재고 차감 포함) ──
function saveOrder(cb){
  var total=orderItems.reduce(function(s,c){return s+c.price*c.qty;},0)+_deliveryFee;
  var order={
    id:'ORD'+Date.now(),
    date:toISO(new Date()),
    time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),
    name:ordererInfo.name,
    phone:ordererInfo.phone,
    addr:ordererInfo.addr,
    memo:ordererInfo.memo,
    items:orderItems.map(function(c){return {menuId:(c.menuId!=null?c.menuId:null),name:c.name,qty:c.qty,price:c.price};}),
    total:total,
    deliveryFee:_deliveryFee,
    additionalRequest:ordererInfo.additionalRequest||'',
    deviceId:getDeviceId(),
    status:'pending'
  };

  fetch(API_URL+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:order})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.success&&d.soldOut){if(cb)cb({success:false,soldOut:d.soldOut});return;}
      // 주문 성공 → localStorage에 기록
      var orders=JSON.parse(localStorage.getItem('orders')||'[]');
      orders.unshift(order);
      localStorage.setItem('orders',JSON.stringify(orders));
      // 고객 정보 자동 저장 — 다음 주문 시 자동완성에 사용 (fire-and-forget)
      if(order.name&&order.phone){
        fetch(API_URL+'/api/customers-master',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:order.name,phone:order.phone,addr1:order.addr||'',memo:order.memo||'',device_id:getDeviceId()})
        }).catch(function(){});
      }
      if(cb)cb({success:true,order:order});
    })
    .catch(function(){if(cb)cb({success:false,soldOut:[]});});

  return order;
}

  var el=document.getElementById('orderContent');

  var total=orderItems.reduce(function(s,c){return s+c.price*c.qty;},0);

  var sec=document.createElement('div');
  sec.className='order-section';

  var listBox=document.createElement('div');
  listBox.style.cssText='background:#fff;border-radius:14px;padding:4px 16px;box-shadow:0 2px 12px rgba(8,98,102,.08);';
  orderItems.forEach(function(c){
    var row=document.createElement('div');
    row.className='order-item';
    row.innerHTML='<div><div class="order-iname">'+c.name+'</div><div class="order-iqty">'+c.qty+'개</div></div>'
      +'<div class="order-iprice">'+comma(c.price*c.qty)+'천원</div>';

  sec.appendChild(listBox);

// 레거시 memo "배송방법 / 인라인노트" → memo는 배송방법만, 노트는 additionalRequest로 이관 (1회, DB 동기화)
function _migrateLegacyMemo(all){
  all.forEach(function(o){
    if(o.date!==menuDate)return;
    var idx=(o.memo||'').indexOf(' / ');
    if(idx<0)return;
    var method=o.memo.slice(0,idx).trim();
    var note=o.memo.slice(idx+3).trim();
    if(note){
      var existing=(o.additionalRequest||'').trim();
      o.additionalRequest=existing?(note+'\n'+existing):note;
    }
    o.memo=method;
    fetch(API_URL+'/api/orders/'+encodeURIComponent(o.id)+'/memo',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({memo:method})}).catch(function(){});
    if(o.additionalRequest){
      fetch(API_URL+'/api/orders/'+encodeURIComponent(o.id)+'/request',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:o.additionalRequest})}).catch(function(){});
    }
  });
}

var _trkAllMenus=[]; // '나의 기록' 상세팝업용 — 오늘 등록 여부와 무관하게 전체 마스터 메뉴에서 이름으로 찾기 위함

  var el=document.getElementById('trackerContent');

  var did=getDeviceId();

    fetch(API_URL+'/api/orders?deviceId='+encodeURIComponent(did),{cache:'no-store'}).then(function(r){return r.json();}),
    fetch(API_URL+'/api/tracker/mine?deviceId='+encodeURIComponent(did),{cache:'no-store'}).then(function(r){return r.json();}),
    fetch(API_URL+'/api/menu/all',{cache:'no-store'}).then(function(r){return r.json();})

function _trkShowDetail(name){
  var m=_trkAllMenus.find(function(x){return x.name===name;});

  if(_mImg){var img=document.createElement('img');img.src=_mImg;img.alt=m.name;img.onerror=function(){imgWrap.textContent=getMenuEmoji(m.name,m.cat);};imgWrap.appendChild(img);}
  else{imgWrap.textContent=getMenuEmoji(m.name,m.cat);}
  var closeBtn=document.createElement('button');

  priceEl.innerHTML=comma(m.price)+'<span>천원</span>';

function _doRenderTracker(el,ordersRes,trackerRes){
  el.innerHTML='';
  var orders=(ordersRes&&ordersRes.success&&Array.isArray(ordersRes.orders))?ordersRes.orders:[];
  var normalOrders=orders.filter(function(o){return !o.reserveDate;});
  var reserveOrders=orders.filter(function(o){return !!o.reserveDate;});
  var recommendLogs=(trackerRes&&trackerRes.success&&Array.isArray(trackerRes.recommendLogs))?trackerRes.recommendLogs:[];
  var topMenus=(trackerRes&&trackerRes.success&&Array.isArray(trackerRes.topMenus))?trackerRes.topMenus:[];

  var sumTitle=document.createElement('div');
  sumTitle.className='trk-section-title';
  sumTitle.textContent='📋 주문·예약 요약';
  el.appendChild(sumTitle);
  var sumRow=document.createElement('div');
  sumRow.className='trk-summary-row';
  sumRow.innerHTML=
    '<div class="trk-stat"><div class="trk-stat-num">'+normalOrders.length+'</div><div class="trk-stat-label">총 주문</div></div>'
    +'<div class="trk-stat"><div class="trk-stat-num">'+reserveOrders.length+'</div><div class="trk-stat-label">총 예약</div></div>';
  el.appendChild(sumRow);

  // 실제 주문(취소 제외) 항목을 메뉴별로 집계 — 클릭·AI추천과 달리 '진짜 산' 메뉴만 모아서 별도로 보여줌
  var orderedMenuMap={};
  orders.forEach(function(o){
    if(o.status==='cancelled')return;
    (o.items||[]).forEach(function(it){
      var key=it.name;
      if(!orderedMenuMap[key])orderedMenuMap[key]={name:it.name,cat:it.cat||'',qty:0};
      orderedMenuMap[key].qty+=(it.qty||1);
    });
  });
  var orderedMenus=Object.keys(orderedMenuMap).map(function(k){return orderedMenuMap[k];}).sort(function(a,b){return b.qty-a.qty;}).slice(0,10);

  var ordTitle=document.createElement('div');
  ordTitle.className='trk-section-title';
  ordTitle.textContent='📦 실제 주문한 메뉴';
  el.appendChild(ordTitle);
  if(!orderedMenus.length){
    el.appendChild(_trkEmpty('아직 주문한 메뉴가 없어요.'));
  }else{
    var ordWrap=document.createElement('div');
    ordWrap.className='hist-list';
    orderedMenus.forEach(function(m,i){
      var row=document.createElement('div');
      row.className='hist-li'+(i>=3?' trk-more-hidden':'');
      row.style.cursor='pointer';
      row.dataset.name=m.name;
      row.innerHTML=
        '<div class="trk-rank">'+(i+1)+'</div>'
        +'<div class="hist-li-main"><div class="hist-li-sum-text" style="font-size:14px;font-weight:700;color:#333;">'+_escTrk(menuDisplayName(m.name,m.cat))+'</div></div>'
        +'<div class="hist-li-right"><span class="hist-li-total">'+m.qty+'개</span></div>';
      ordWrap.appendChild(row);
    });
    ordWrap.addEventListener('click',function(e){
      var row=e.target.closest('.hist-li');
      if(!row||!row.dataset.name)return;
      _trkShowDetail(row.dataset.name);
    });
    el.appendChild(ordWrap);
    if(orderedMenus.length>3){
      var moreBtn=document.createElement('div');
      moreBtn.className='trk-more-btn';
      moreBtn.textContent='더보기 ('+(orderedMenus.length-3)+'개 더)';
      moreBtn.onclick=function(){
        ordWrap.querySelectorAll('.trk-more-hidden').forEach(function(r){r.classList.remove('trk-more-hidden');});
        moreBtn.remove();
      };
      el.appendChild(moreBtn);
    }
  }

  var recTitle=document.createElement('div');
  recTitle.className='trk-section-title';
  recTitle.textContent='🎯 AI추천 선택 내역';
  el.appendChild(recTitle);
  if(!recommendLogs.length){
    el.appendChild(_trkEmpty('AI추천에서 메뉴를 적용한 이력이 없어요.'));
  }else{
    var recWrap=document.createElement('div');
    recWrap.className='hist-list';
    recommendLogs.forEach(function(r){
      var row=document.createElement('div');
      row.className='hist-li';
      row.style.cursor='default';
      var scopeLabel=r.scope==='today'?'오늘의 메뉴':'전체 메뉴';
      var picksHtml=(r.picks||[]).map(function(p){return '<span class="trk-pick-chip">'+_escTrk(p)+'</span>';}).join('');
      row.innerHTML=
        '<div class="hist-li-main">'
          +'<div class="hist-li-top"><span class="hist-li-dt">'+_fmtTrkDT(r.createdAt)+'</span><span class="hist-li-badge reorder">'+scopeLabel+'</span></div>'
          +'<div class="trk-picks">'+picksHtml+'</div>'
          +(r.reason?'<div class="trk-reason">'+_escTrk(r.reason)+'</div>':'')
        +'</div>'
        +'<button type="button" class="hist-item-del trk-del-btn">✕</button>';
      row.querySelector('.trk-del-btn').dataset.id=r.id;
      recWrap.appendChild(row);
    });
    recWrap.addEventListener('click',function(e){
      var btn=e.target.closest('.trk-del-btn');
      if(btn){
        var id=btn.dataset.id;
        fetch(API_URL+'/api/tracker/recommend/'+encodeURIComponent(id)+'?deviceId='+encodeURIComponent(getDeviceId()),{method:'DELETE'})
          .then(function(r){return r.json();})
          .then(function(d){ if(d.success)renderTracker(); else showToast(d.error||'삭제 실패'); })
          .catch(function(){ showToast('삭제 실패'); });
        return;
      }
      var chip=e.target.closest('.trk-pick-chip');
      if(chip){ _trkShowDetail(chip.textContent); }
    });
    el.appendChild(recWrap);
  }

  var clickTitle=document.createElement('div');
  clickTitle.className='trk-section-title';
  clickTitle.textContent='👀 자주 살펴본 메뉴';
  el.appendChild(clickTitle);
  if(!topMenus.length){
    el.appendChild(_trkEmpty('아직 살펴본 메뉴 기록이 없어요.'));
  }else{
    var clickWrap=document.createElement('div');
    clickWrap.className='hist-list';
    topMenus.forEach(function(m,i){
      var row=document.createElement('div');
      row.className='hist-li';
      row.style.cursor='pointer';
      row.dataset.name=m.name;
      row.innerHTML=
        '<div class="trk-rank">'+(i+1)+'</div>'
        +'<div class="hist-li-main"><div class="hist-li-sum-text" style="font-size:14px;font-weight:700;color:#333;">'+_escTrk(menuDisplayName(m.name,m.cat))+'</div></div>'
        +'<div class="hist-li-right"><span class="hist-li-total">'+m.count+'회</span></div>'
        +'<button type="button" class="hist-item-del trk-del-btn">✕</button>';
      row.querySelector('.trk-del-btn').dataset.name=m.name;
      clickWrap.appendChild(row);
    });
    clickWrap.addEventListener('click',function(e){
      var btn=e.target.closest('.trk-del-btn');
      if(btn){
        var name=btn.dataset.name;
        fetch(API_URL+'/api/tracker/click?deviceId='+encodeURIComponent(getDeviceId())+'&name='+encodeURIComponent(name),{method:'DELETE'})
          .then(function(r){return r.json();})
          .then(function(d){ if(d.success)renderTracker(); else showToast(d.error||'삭제 실패'); })
          .catch(function(){ showToast('삭제 실패'); });
        return;
      }
      var row=e.target.closest('.hist-li');
      if(row&&row.dataset.name){ _trkShowDetail(row.dataset.name); }
    });
    el.appendChild(clickWrap);
  }
}

function _escTrk(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function _fmtTrkDT(ts){
  if(!ts)return'';
  try{return new Date(ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}
}

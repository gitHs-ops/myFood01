<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 반찬 — 웹 주문 서비스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#086266;--teal2:#0a7a7f;
  --amber:#E9A826;--green:#1D9E75;
  --bg:#f7fafa;--dark:#1a1a1a;--sub:#555;
}
html,body{min-height:100vh;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--dark);}

/* ── 상단 네비 ── */
.top-nav{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:rgba(8,98,102,.97);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:56px;
  box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.top-nav-logo{font-size:16px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;text-decoration:none;}
.top-nav-links{display:flex;align-items:center;gap:6px;}
.top-nav-btn{
  padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;
  transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.top-nav-btn-ghost{background:rgba(255,255,255,.12);color:#fff;}
.top-nav-btn-ghost:hover{background:rgba(255,255,255,.22);}
.top-nav-btn-amber{background:var(--amber);color:#3A1D1D;}
.top-nav-btn-amber:hover{filter:brightness(1.1);}
body{padding-top:56px;}
@media(max-width:600px){
  .top-nav{padding:0 12px;}
  .top-nav-btn{padding:6px 10px;font-size:12px;}
  .top-nav-logo span{display:none;}
}

/* ── 표지 ── */
.cover{
  background:linear-gradient(145deg,var(--teal) 0%,var(--teal2) 60%,#0d9b9f 100%);
  padding:56px 24px 48px;text-align:center;position:relative;overflow:hidden;
}
.cover::before{
  content:'';position:absolute;top:-80px;right:-80px;
  width:400px;height:400px;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none;
}
.cover::after{
  content:'';position:absolute;bottom:-100px;left:-60px;
  width:320px;height:320px;border-radius:50%;
  background:rgba(255,255,255,.04);pointer-events:none;
}
.cover-emoji{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));}
.cover-title{font-size:34px;font-weight:900;color:#fff;margin-bottom:10px;letter-spacing:-.5px;}
.cover-desc{font-size:15px;color:rgba(255,255,255,.75);font-weight:500;}

/* ── 메뉴 카드 섹션 ── */
.cards-section{padding:40px 20px 60px;max-width:900px;margin:0 auto;}
.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
@media(max-width:700px){
  .cards-grid{grid-template-columns:1fr;}
}
.menu-card{
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 4px 24px rgba(8,98,102,.10);
  text-decoration:none;color:var(--dark);
  display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s;
}
.menu-card:hover{transform:translateY(-4px);box-shadow:0 10px 32px rgba(8,98,102,.18);}

/* 카드 이미지 영역 */
.card-img{
  height:160px;display:flex;align-items:center;justify-content:center;
  font-size:72px;position:relative;overflow:hidden;
}
.card-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.10));
}
.card-img-admin{background:linear-gradient(135deg,#086266 0%,#0a9b9f 100%);}
.card-img-customer{background:linear-gradient(135deg,#b85c00 0%,#E9A826 100%);}
.card-img-orders{background:linear-gradient(135deg,#0e6e4e 0%,#1D9E75 100%);}

.card-body{padding:20px 18px 22px;}
.card-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--teal);
  background:#e0f7f6;border-radius:999px;padding:3px 10px;
  margin-bottom:10px;
}
.card-name{font-size:19px;font-weight:900;color:var(--dark);margin-bottom:6px;}
.card-desc{font-size:13px;color:var(--sub);line-height:1.7;}
.card-arrow{
  margin-top:16px;font-size:13px;font-weight:700;color:var(--teal);
  display:flex;align-items:center;gap:4px;
}

/* ── 푸터 ── */
footer{
  text-align:center;padding:24px;
  font-size:12px;color:#aaa;
  border-top:1px solid #eee;
}
</style>
</head>
<body>

<nav class="top-nav">
  <a class="top-nav-logo" href="#">🍱 <span>오늘의 반찬</span></a>
  <div class="top-nav-links">
    <a class="top-nav-btn top-nav-btn-ghost" href="menu-manager.html">🔒 관리자 메뉴</a>
    <a class="top-nav-btn top-nav-btn-ghost" href="onban.html">🛒 고객 메뉴</a>
    <a class="top-nav-btn top-nav-btn-amber" href="menu-manager.html" onclick="localStorage.setItem('mm_goto','orders')">📦 주문 관리</a>
  </div>
</nav>

<!-- 표지 -->
<section class="cover">
  <div class="cover-emoji">🍱</div>
  <h1 class="cover-title">오늘의 반찬</h1>
  <p class="cover-desc">온라인 메뉴 관리 · 주문 서비스</p>
</section>

<!-- 메인 카드 3개 -->
<div class="cards-section">
  <div class="cards-grid">

    <!-- 관리자 메뉴 -->
    <a class="menu-card" href="menu-manager.html">
      <div class="card-img card-img-admin">🍽️</div>
      <div class="card-body">
        <div class="card-label">🔒 관리자 전용</div>
        <div class="card-name">관리자 메뉴</div>
        <div class="card-desc">오늘의 메뉴 등록 · 재고 관리<br>카카오 발송 텍스트 생성</div>
        <div class="card-arrow">바로가기 →</div>
      </div>
    </a>

    <!-- 고객 메뉴 -->
    <a class="menu-card" href="onban.html">
      <div class="card-img card-img-customer">🛒</div>
      <div class="card-body">
        <div class="card-label" style="color:#b85c00;background:#fff8e1;">🛒 고객 주문</div>
        <div class="card-name">고객 메뉴</div>
        <div class="card-desc">오늘의 반찬 메뉴 확인<br>장바구니 담기 & 주문하기</div>
        <div class="card-arrow" style="color:var(--amber);">바로가기 →</div>
      </div>
    </a>

    <!-- 주문 관리 -->
    <a class="menu-card" href="menu-manager.html" onclick="localStorage.setItem('mm_goto','orders')">
      <div class="card-img card-img-orders">📦</div>
      <div class="card-body">
        <div class="card-label" style="color:#0e6e4e;background:#e8f8f2;">📦 주문 현황</div>
        <div class="card-name">주문 관리</div>
        <div class="card-desc">접수된 주문 확인<br>배송 확정 · 완료 처리</div>
        <div class="card-arrow" style="color:var(--green);">바로가기 →</div>
      </div>
    </a>

  </div>
</div>

<footer>오늘의 반찬 웹 주문 서비스 &nbsp;|&nbsp; 2026</footer>

<script>
(function(){
  var GAS_URL='https://script.google.com/macros/s/AKfycbwtXJL4_lMynbG4U13PqbnPOiTp15evyw0BPPQ0A9aV5QYlI5dSQB4Ru-8BOqVR9RPq1w/exec';
  var ua=encodeURIComponent((navigator.userAgent||'').slice(0,200));
  var ref=encodeURIComponent((document.referrer||'').slice(0,200));
  fetch(GAS_URL+'?action=log_access&page=index&ua='+ua+'&ref='+ref,{redirect:'follow'}).catch(function(){});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 반찬 — 웹 주문 서비스</title>
<script>
(function(){
  // ← 관리자 비밀번호. menu-manager.html의 ONBAN_ADMIN_KEY, Railway 환경변수 ADMIN_TOKEN과 같은 값으로 유지할 것.
  var ONBAN_ADMIN_KEY='onban@1234';
  // 로그인 유지 값을 비밀번호에 묶는다 — 비밀번호를 바꾸면 기존에 로그인돼 있던 기기도 다시 물어본다
  var AUTH_VAL='ok_'+ONBAN_ADMIN_KEY;
  if(localStorage.getItem('onban_admin_auth')===AUTH_VAL)return;
  // 모바일 키보드가 뒤에 공백을 붙이거나 붙여넣기에 공백이 딸려오는 경우가 있어 다듬어서 비교
  var input=(prompt('관리자 비밀번호를 입력하세요 (영문 모드로 전환 후 입력)')||'').trim();
  if(input===ONBAN_ADMIN_KEY){localStorage.setItem('onban_admin_auth',AUTH_VAL);}
  else{
    alert(input?'비밀번호가 다릅니다.\n키보드가 한글 모드가 아닌지 확인해주세요.':'접근 권한이 없습니다.');
    location.replace('onban.html');
  }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#086266;--teal2:#0a7a7f;
  --amber:#E9A826;--green:#1D9E75;
  --bg:#f7fafa;--dark:#1a1a1a;--sub:#555;
}
html,body{min-height:100vh;font-family:'Noto Sans KR',sans-serif;background:linear-gradient(to bottom,#1a3838,#000000) fixed;color:var(--dark);}


/* ── 표지 ── */
.cover{
  background:#000;
  padding:0 24px 18px;text-align:center;position:relative;overflow:hidden;
}
.cover-logo{width:160px;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;mix-blend-mode:lighten;}
.cover-title{font-size:21px;font-weight:400;color:#fff;margin-bottom:6px;letter-spacing:-.5px;}
.cover-desc{font-size:13px;color:rgba(255,255,255,.75);font-weight:500;}

/* ── 메뉴 카드 섹션 ── */
.cards-section{
  padding:20px 20px 28px;
  background:linear-gradient(to bottom,#000000 0%,#0a1a1a 50%,#111f1f 100%);
}
.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  max-width:900px;margin:0 auto;
}
@media(max-width:700px){
  .cards-grid{grid-template-columns:1fr;}
}
.menu-card{
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 4px 24px rgba(8,98,102,.10);
  text-decoration:none;color:var(--dark);
  display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s;
}
.menu-card:hover{transform:translateY(-4px);box-shadow:0 10px 32px rgba(8,98,102,.18);}

/* 카드 이미지 영역 */
.card-img{
  height:120px;display:flex;align-items:center;justify-content:center;
  font-size:56px;position:relative;overflow:hidden;
}
.card-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.10));
}
.card-img-admin{background:linear-gradient(135deg,#086266 0%,#0a9b9f 100%);}
.card-img-customer{background:linear-gradient(135deg,#b85c00 0%,#E9A826 100%);}
.card-img-orders{background:linear-gradient(135deg,#0e6e4e 0%,#1D9E75 100%);}

.card-body{padding:14px 16px 16px;}
.card-label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--teal);
  background:#e0f7f6;border-radius:999px;padding:3px 10px;
  margin-bottom:10px;
}
.card-name{font-size:19px;font-weight:900;color:var(--dark);margin-bottom:6px;}
.card-desc{font-size:13px;color:var(--sub);line-height:1.7;}
.card-arrow{
  margin-top:16px;font-size:13px;font-weight:700;color:var(--teal);
  display:flex;align-items:center;gap:4px;
}

/* ── 푸터 ── */
footer{
  text-align:center;padding:24px;
  font-size:12px;color:#aaa;
  border-top:1px solid #eee;
}
</style>
</head>
<body>


<!-- 표지 -->
<section class="cover">
  <img class="cover-logo" src="온반_로고.png" alt="오늘의 반찬 로고">
  <h1 class="cover-title">엄마의 정성처럼 따뜻한 마음과 온기를 담았습니다</h1>
  <p class="cover-desc">온라인 메뉴 관리 · 주문 서비스</p>
  <span style="display:inline-flex;gap:8px;margin-top:12px;">
    <a href="관리자페이지_사용매뉴얼.html" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:6px 16px;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.3);">📖 관리자 매뉴얼</a>
    <a href="온반_메뉴_이미지갤러리.html" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:6px 16px;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.3);">🖼️ 메뉴 이미지 갤러리</a>
  </span>
</section>

<!-- 메인 카드 3개 -->
<div class="cards-section">
  <div class="cards-grid">

    <!-- 관리자 메뉴 -->
    <a class="menu-card" href="menu-manager.html">
      <div class="card-img card-img-admin">🍽️</div>
      <div class="card-body">
        <div class="card-label">🔒 관리자 전용</div>
        <div class="card-name">관리자 메뉴</div>
        <div class="card-desc">오늘의 메뉴 등록 · 재고 관리<br>카카오 발송 텍스트 생성</div>
        <div class="card-arrow">바로가기 →</div>
      </div>
    </a>

    <!-- 고객 메뉴 -->
    <a class="menu-card" href="onban01.html">
      <div class="card-img card-img-customer">🛒</div>
      <div class="card-body">
        <div class="card-label" style="color:#b85c00;background:#fff8e1;">🛒 고객 주문</div>
        <div class="card-name">고객 메뉴</div>
        <div class="card-desc">오늘의 반찬 메뉴 확인<br>장바구니 담기 & 주문하기</div>
        <div class="card-arrow" style="color:var(--amber);">바로가기 →</div>
      </div>
    </a>

    <!-- 주문 관리 -->
    <a class="menu-card" href="menu-manager.html" onclick="localStorage.setItem('mm_goto','orders')">
      <div class="card-img card-img-orders">📦</div>
      <div class="card-body">
        <div class="card-label" style="color:#0e6e4e;background:#e8f8f2;">📦 주문 현황</div>
        <div class="card-name">주문 관리</div>
        <div class="card-desc">접수된 주문 확인<br>주문 접수 · 배송 완료 처리</div>
        <div class="card-arrow" style="color:var(--green);">바로가기 →</div>
      </div>
    </a>

  </div>
</div>

<footer>오늘의 반찬 웹 주문 서비스 &nbsp;|&nbsp; 2026</footer>

<script>
(function(){
  var API_URL='https://myfood01-production.up.railway.app';
  var ref=(document.referrer||'').slice(0,200);
  fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(d){
    fetch(API_URL+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip:d.ip||'',ref:ref,page:'index'})}).catch(function(){});
  }).catch(function(){
    fetch(API_URL+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip:'unknown',ref:ref,page:'index'})}).catch(function(){});
  });
})();
</script>
</body>
</html>

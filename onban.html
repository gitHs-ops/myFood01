<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 반찬</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0faf9;font-family:'Noto Sans KR',sans-serif;padding:30px;}
  .icon{font-size:80px;margin-bottom:24px;animation:bounce 1.4s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  h1{font-size:22px;font-weight:800;color:#086266;margin-bottom:12px;text-align:center;}
  p{font-size:14px;color:#555;line-height:1.8;text-align:center;}
  .card{background:#fff;border-radius:20px;padding:40px 32px;box-shadow:0 4px 24px rgba(8,98,102,.10);max-width:380px;width:100%;text-align:center;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>서비스 준비 중입니다</h1>
    <p>더 나은 서비스를 위해 잠시 점검 중이에요.<br>조금만 기다려 주시면 곧 찾아뵐게요! 😊</p>
  </div>
</body>
</html>
